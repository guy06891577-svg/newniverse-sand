<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:">
<title>뉴니버스 문자</title>
<style>
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--a1:#6fd3ff;--a2:#8f6bff;--acc:linear-gradient(135deg,var(--a1),var(--a2));--red:#ff4d6d;--fg:#f3f1ff;--sub:rgba(226,222,255,.62);--dim:rgba(226,222,255,.38);
 --glass:rgba(255,255,255,.075);--line:rgba(255,255,255,.14);--r:22px;
 --font:"Pretendard","Noto Sans KR","Apple SD Gothic Neo",system-ui,-apple-system,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;background:#04030c;color:var(--fg);font-family:var(--font);overflow:hidden}
button,input,textarea{font-family:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
svg{display:block}
#app{position:fixed;inset:0;overflow:hidden;background:#05040f}
#neb{position:absolute;inset:0;width:100%;height:100%}
.view{position:absolute;inset:0;display:flex;flex-direction:column;padding-top:calc(var(--sat) + 6px)}
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2)}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;min-height:0}
.scroll::-webkit-scrollbar{display:none}
.icb{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--fg);flex:none}
.icb svg{width:24px;height:24px}
.icb:active{background:rgba(143,107,255,.18)}
/* 목록 */
.head{display:flex;align-items:center;padding:12px 10px 6px 22px;gap:8px}
.head h1{flex:1;font-size:26px;font-weight:800;letter-spacing:-.5px;display:flex;align-items:baseline;gap:8px}
.head h1 small{font-size:13px;font-weight:600;color:var(--a1)}
#more{position:relative;opacity:.85}
#more svg{width:22px;height:22px}
#more.on{background:rgba(143,107,255,.18);opacity:1}
#more i{position:absolute;top:8px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--a1);box-shadow:0 0 6px var(--a1)}
.sbox{margin:4px 14px 10px;border-radius:18px;display:flex;align-items:center;gap:8px;padding:0 6px 0 14px;height:46px}
.sbox>span{flex:none;display:flex;color:var(--sub)}.sbox>span svg{width:18px;height:18px}
.sbox input{flex:1;min-width:0;background:none;border:none;outline:none;font-size:15.5px}
.sbox input::placeholder{color:var(--dim)}
.sbox input::-webkit-search-cancel-button,.sbox input::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none}
.sbox .x{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--dim)}
.sbox .x svg{width:16px;height:16px}
#lList{padding:0 14px calc(var(--sab) + 110px)}
.trow{display:flex;align-items:center;gap:12px;padding:12px;border-radius:20px;margin-bottom:6px;width:100%;text-align:left;cursor:pointer}
.trow:active{background:rgba(143,107,255,.12)}
.av{flex:none;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;color:var(--fg);background:rgba(143,107,255,.16);border:1px solid rgba(160,190,255,.22);position:relative}
.av svg{width:22px;height:22px;color:var(--a1)}
.trow.un .av{border:none;background:var(--acc);color:#0a0820}
.trow.un .av svg{color:#0a0820}
.tm{flex:1;min-width:0}
.tl{display:flex;align-items:baseline;gap:8px}
.tn{flex:1;min-width:0;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow.un .tn{font-weight:800}
.tt{flex:none;font-size:12px;color:var(--dim)}
.trow.un .tt{color:var(--a1);font-weight:700}
.ts{display:flex;align-items:center;gap:8px;margin-top:3px}
.tsn{flex:1;min-width:0;font-size:13.5px;color:var(--sub);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
.trow.un .tsn{color:var(--fg)}
.tsn .f{color:#ff8da0;font-weight:700}
.cnt{flex:none;min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:var(--acc);color:#0a0820;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
em{font-style:normal;color:var(--a1);font-weight:700}
.sec{font-size:12.5px;font-weight:700;color:var(--sub);padding:12px 6px 6px}
#fab{position:absolute;right:20px;bottom:calc(var(--sab) + 24px);width:60px;height:60px;border-radius:50%;background:var(--acc);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(111,160,255,.45);z-index:5}
#fab svg{width:26px;height:26px;color:#0a0820}
.empty{padding:50px 22px;text-align:center;color:var(--sub);font-size:14px;line-height:1.6}
.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:6px}
.empty button{margin-top:14px;padding:11px 18px;border-radius:16px;font-weight:700;color:#0a0820;background:var(--acc);font-size:14px}
.empty .b2{margin-left:8px;background:none;color:var(--fg);border:1px solid var(--line)}
.empty small{display:block;margin-top:10px;font-size:12.5px;color:var(--sub)}
/* 대화 */
.bar{display:flex;align-items:center;gap:6px;padding:6px 8px 8px}
.bar .who{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.bar .av{width:38px;height:38px;font-size:15px}
.bar .nm{font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .no{font-size:12px;color:var(--sub);margin-top:1px}
.bar .wt{min-width:0}
.bar h2{flex:1;font-size:21px;font-weight:800}
#cList{padding:6px 14px 12px;display:flex;flex-direction:column}
.day{align-self:center;margin:14px 0 8px;padding:5px 12px;border-radius:12px;font-size:12px;font-weight:600;color:var(--sub);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)}
.m{display:flex;align-items:flex-end;gap:6px;margin-top:3px;max-width:100%}
.m.g{margin-top:10px}
.m.out{flex-direction:row-reverse}
.bb{max-width:76%;padding:9px 13px;border-radius:20px;font-size:15.5px;line-height:1.45;white-space:pre-wrap;word-break:break-word;user-select:text}
.m.in .bb{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.12);border-bottom-left-radius:7px}
.m.out .bb{background:var(--acc);color:#0a0820;border-bottom-right-radius:7px;font-weight:500}
.m.out.fail .bb{background:rgba(255,77,109,.18);color:var(--fg);border:1px solid rgba(255,77,109,.45)}
.m.out.sending .bb{opacity:.7}
.mt{flex:none;font-size:11px;color:var(--dim);padding-bottom:2px;white-space:nowrap}
.mt .f{color:#ff8da0;font-weight:700}
.mimg{display:block;max-width:100%;width:220px;border-radius:14px;margin:2px 0 4px;background:rgba(255,255,255,.05);min-height:120px;object-fit:cover}
.mimg.ok{min-height:0;background:none}
.mbad{font-size:13px;color:var(--sub)}
.msub{display:block;font-weight:700;margin-bottom:2px}
#cBar{display:flex;align-items:flex-end;gap:8px;padding:8px 10px calc(var(--sab) + 10px)}
.inw{flex:1;min-width:0;border-radius:22px;padding:4px 6px 4px 14px;display:flex;flex-direction:column}
#cIn{width:100%;background:none;border:none;outline:none;resize:none;font-size:16px;line-height:1.4;max-height:120px;padding:7px 0;display:block}
#cIn::placeholder{color:var(--dim)}
#cCnt{font-size:11px;color:var(--dim);padding:0 0 4px}
#cCnt .lms{display:inline-block;padding:0 6px;border-radius:7px;background:var(--acc);color:#0a0820;font-weight:800;font-size:10px;letter-spacing:.3px}
#cSend{flex:none;width:46px;height:46px;border-radius:50%;background:var(--acc);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(111,160,255,.35)}
#cSend svg{width:22px;height:22px;color:#0a0820}
#cSend:disabled{background:rgba(255,255,255,.1);box-shadow:none}
#cSend:disabled svg{color:var(--dim)}
.cnote{text-align:center;font-size:12.5px;color:var(--dim);padding:30px 20px;line-height:1.6}
/* 새 문자 */
.tofield{margin:2px 14px 10px;border-radius:18px;display:flex;align-items:center;gap:10px;padding:0 8px 0 16px;height:50px}
.tofield label{font-size:14px;color:var(--sub);font-weight:600;flex:none}
.tofield input{flex:1;min-width:0;background:none;border:none;outline:none;font-size:16px}
#nList{padding:0 14px calc(var(--sab) + 30px)}
.crow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:18px;width:100%;text-align:left;cursor:pointer}
.crow:active{background:rgba(143,107,255,.12)}
.crow .av{width:40px;height:40px;font-size:15px}
.crow .tn{font-size:15.5px}
.crow .no{font-size:12.5px;color:var(--sub);margin-top:2px}
/* 설정 */
#setList{padding:4px 14px calc(var(--sab) + 30px)}
.set{border-radius:var(--r);padding:6px 14px;margin-bottom:12px}
.set h3{font-size:13px;font-weight:700;color:var(--sub);padding:10px 2px 4px}
.srow2{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid rgba(255,255,255,.06);font-size:14.5px}
.srow2:last-child{border-bottom:none}
.srow2 .grow{flex:1}
.srow2 small{display:block;font-size:12px;color:var(--sub);margin-top:2px;line-height:1.45}
.ok{color:var(--a1);font-weight:700;font-size:13px}
.no2{color:#ff8da0;font-weight:700;font-size:13px}
.sbtn{padding:8px 13px;border-radius:13px;font-size:13px;font-weight:700;border:1px solid var(--line);flex:none}
.sbtn.pri{background:var(--acc);color:#0a0820;border:none}
.steps{font-size:13px;color:var(--sub);line-height:1.7;padding:4px 2px 10px}
.steps b{color:var(--fg)}
.steps ol{padding-left:18px}
/* v10: 입금 · 나갈 돈 */
#moneyBar{padding:0 14px}
.mcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:20px;margin:0 0 8px;cursor:pointer}
.mcard:active{background:rgba(143,107,255,.14)}
.mcard .mi2{flex:none;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(143,107,255,.16);border:1px solid rgba(160,190,255,.22);color:var(--a1)}
.mcard .mi2 svg{width:20px;height:20px}
.mcard b{display:block;font-size:15.5px;font-weight:800;letter-spacing:-.2px}
.mcard small{display:block;font-size:12px;color:var(--sub);margin-top:2px}
.mcard .go{margin-left:auto;color:var(--dim);flex:none}.mcard .go svg{width:18px;height:18px;transform:rotate(180deg)}
.seg{display:flex;gap:6px;padding:4px 14px 10px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;padding:9px 15px;border-radius:16px;font-size:14px;font-weight:700;color:var(--sub);border:1px solid var(--line);background:var(--glass)}
.seg button.on{background:var(--acc);color:#0a0820;border-color:transparent}
#moneyList{padding:0 14px calc(var(--sab) + 30px)}
.msum{border-radius:var(--r);padding:18px 18px 16px;margin-bottom:12px}
.msum .lb{font-size:13px;font-weight:700;color:var(--sub)}
.msum .big{font-size:34px;font-weight:800;letter-spacing:-1px;margin-top:4px;background:var(--acc);-webkit-background-clip:text;background-clip:text;color:transparent}
.msum .sub{font-size:13.5px;color:var(--sub);margin-top:2px}
.mrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;margin-bottom:6px}
.mrow .tm2{flex:none;width:62px;font-size:12px;color:var(--sub);line-height:1.35}
.mrow .mid{flex:1;min-width:0}
.mrow .nm2{font-size:15.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .pill{display:inline-block;margin-top:3px;padding:1px 8px;border-radius:9px;font-size:11px;font-weight:700;color:var(--a1);border:1px solid rgba(111,211,255,.35)}
.mrow .am{flex:none;font-size:15.5px;font-weight:800;text-align:right}
.mrow .am small{display:block;font-size:11px;font-weight:600;color:var(--sub);margin-top:2px}
.mnote{font-size:12.5px;color:var(--sub);line-height:1.6;padding:8px 4px 4px}
.mnote b{color:var(--fg)}
/* ⋮ 메뉴 */
#mbd{position:absolute;inset:0;z-index:34}
#menu{position:absolute;top:calc(var(--sat) + 70px);right:12px;width:min(300px,calc(100% - 24px));z-index:35;border-radius:22px;padding:6px;background:#15122c;border:1px solid rgba(160,190,255,.22);box-shadow:0 18px 50px rgba(0,0,0,.5);transform-origin:top right;animation:mIn .16s ease-out}
@keyframes mIn{from{opacity:0;transform:scale(.94) translateY(-4px)}to{opacity:1;transform:none}}
#menu .mi{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:16px;text-align:left;color:var(--fg);font-size:14.5px;font-weight:600;line-height:1.3}
#menu .mi:active{background:rgba(255,255,255,.07)}
#menu .mi svg{flex:none;width:20px;height:20px;color:var(--a1)}
#menu .mi small{display:block;font-size:11.5px;font-weight:500;color:var(--sub);margin-top:2px}
#menu .mi.st{cursor:default}
#menu .mi.st b{color:var(--a1);font-weight:700}
#menu hr{border:0;height:1px;background:rgba(255,255,255,.07);margin:4px 10px}
/* 아래 시트 · 알림 띠 */
#bd{position:absolute;inset:0;z-index:25;background:rgba(0,0,0,.45)}
#sheet{position:absolute;left:12px;right:12px;bottom:calc(var(--sab) + 14px);border-radius:26px;padding:18px;z-index:30;background:#15122c;border:1px solid rgba(160,190,255,.2)}
#sheet h3{font-size:16px;margin-bottom:10px;line-height:1.4}
#sheet .opt{display:flex;align-items:center;gap:12px;width:100%;padding:12px 6px;font-size:15px;font-weight:600;border-bottom:1px solid rgba(255,255,255,.07);text-align:left}
#sheet .opt:last-child{border-bottom:none}
#sheet .opt svg{width:20px;height:20px;color:var(--a1);flex:none}
#sheet .opt.pri{color:var(--a1)}
#sheet .steps2{font-size:13.5px;line-height:1.6;color:var(--sub);margin:2px 2px 10px}
#sheet .steps2 ol{padding-left:20px;margin:8px 0}#sheet .steps2 li{margin:3px 0}#sheet .steps2 b{color:var(--fg)}
#sheet .path{display:inline-block;margin-top:4px;padding:6px 10px;border-radius:12px;background:rgba(143,107,255,.12);border:1px solid rgba(143,107,255,.25);color:var(--fg);font-size:12.5px}
#sheet .quote{font-size:14px;color:var(--sub);line-height:1.5;max-height:90px;overflow:hidden;margin-bottom:6px;white-space:pre-wrap;word-break:break-all}
#toast{position:absolute;left:50%;bottom:calc(var(--sab) + 100px);transform:translateX(-50%) translateY(20px);opacity:0;z-index:40;padding:10px 16px;border-radius:18px;font-size:13.5px;font-weight:600;white-space:nowrap;transition:all .2s;pointer-events:none;background:rgba(24,20,52,.94);border:1px solid var(--line)}
#toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div id="app">
<canvas id="neb"></canvas>

<section class="view" id="v-list">
 <div class="head"><h1>문자 <small id="lUn"></small></h1><button class="icb" id="more" aria-label="문자 설정 메뉴" aria-haspopup="true"></button></div>
 <div class="sbox glass"><span data-i="search"></span><input id="lQ" type="search" placeholder="이름 · 초성 · 번호 · 문자 내용" autocomplete="off" enterkeyhint="search"><button class="x" id="lQx" aria-label="지우기" hidden></button></div>
 <div id="pendBar"></div>
 <div id="moneyBar"></div>
 <div class="scroll" id="lList"></div>
 <button id="fab" aria-label="새 문자 쓰기"></button>
</section>

<section class="view" id="v-conv" hidden>
 <div class="bar"><button class="icb" id="cBack" aria-label="뒤로"></button><div class="who"><div class="av" id="cAv"></div><div class="wt"><div class="nm" id="cName"></div><div class="no" id="cNum"></div></div></div><button class="icb" id="cCall" aria-label="전화 걸기"></button></div>
 <div class="scroll" id="cList"></div>
 <div id="cBar"><div class="inw glass"><textarea id="cIn" rows="1" placeholder="문자 입력"></textarea><div id="cCnt" hidden></div></div><button id="cSend" aria-label="보내기" disabled></button></div>
</section>

<section class="view" id="v-new" hidden>
 <div class="bar"><button class="icb" id="nBack" aria-label="뒤로"></button><h2>새 문자</h2></div>
 <div class="tofield glass"><label for="nTo">받는 사람</label><input id="nTo" placeholder="이름 · 초성 · 번호" autocomplete="off" inputmode="text"></div>
 <div class="scroll" id="nList"></div>
</section>

<section class="view" id="v-money" hidden>
 <div class="bar"><button class="icb" id="mBack" aria-label="뒤로"></button><h2>입금 · 나갈 돈</h2></div>
 <div class="seg" id="mSeg"></div>
 <div class="scroll" id="moneyList"></div>
</section>

<section class="view" id="v-set" hidden>
 <div class="bar"><button class="icb" id="sBack" aria-label="뒤로"></button><h2>문자 설정</h2></div>
 <div class="scroll" id="setList"></div>
</section>

<div id="mbd" hidden></div><div id="menu" role="menu" hidden></div>
<div id="bd" hidden></div><div id="sheet" hidden></div>
<div id="toast"></div>
</div>
<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const NV=window.NVSms||null;
let ST={perms:{}};let CAL={on:false,perm:false,asked:true};
function calStatus(){if(NV&&NV.calStatus)CAL=J(NV.calStatus(),CAL)||CAL}
/* ---------- 선 아이콘 ---------- */
const P={
 search:'<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>',
 x:'<path d="M6 6l12 12M18 6L6 18"/>',
 more:'<circle cx="12" cy="5.5" r=".9"/><circle cx="12" cy="12" r=".9"/><circle cx="12" cy="18.5" r=".9"/>',
 pen:'<path d="M4 20l1-4.5L15.5 5a2.1 2.1 0 0 1 3 3L8 18.5z"/><path d="M13.5 7l3 3"/>',
 larr:'<path d="M19 12H5M11 6l-6 6 6 6"/>',
 phone:'<path d="M5 4h3.2l1.6 4-2 1.3a11 11 0 0 0 5 5l1.3-2 4 1.6V17a2 2 0 0 1-2 2A15 15 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
 send:'<path d="M12 19V5M6 11l6-6 6 6"/>',
 user:'<circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/>',
 msg:'<path d="M4 5h16v11H9l-5 4z"/>',
 check:'<circle cx="12" cy="12" r="8.5"/><path d="M8.3 12.2l2.6 2.6 4.9-5.3"/>',
 key:'<circle cx="8" cy="15" r="3.6"/><path d="M10.6 12.4L19 4M15.5 7.5l2.5 2.5"/>',
 shield:'<path d="M12 3.5l7 2.6v5.6c0 4.3-2.9 7.6-7 8.8-4.1-1.2-7-4.5-7-8.8V6.1z"/><path d="M9.2 12l2 2 3.8-4"/>',
 ret:'<path d="M9 14l-5-5 5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/>',
 copy:'<rect x="8" y="8" width="11" height="11" rx="2"/><path d="M5 15V6a1 1 0 0 1 1-1h9"/>',
 retry:'<path d="M4 12a8 8 0 0 1 14-5.3L20 9M20 4v5h-5"/><path d="M20 12a8 8 0 0 1-14 5.3L4 15M4 20v-5h5"/>',

  h+=B.items.map(x=>`<div class="mrow glass"><div class="tm2">${mTab==='today'?hm(x.at):esc(mDate(x.at)).replace(' ','<br>')}</div><div class="mid"><div class="nm2">${esc(x.who||'보낸 사람 표시 없음')}</div><span class="pill">${esc(x.bank)}</span></div><div class="am">${esc(x.t)}</div></div>`).join('');
  if(!B.n)h+=`<div class="mnote">은행에서 입금을 <b>문자</b>로 알려 주는 계좌만 보여요. 앱 알림(푸시)으로만 받는 계좌는 문자함에 없어서 안 보여요.</div>`;
  if(M.suspect)h+=`<div class="mnote">입금이라고 적혀 있지만 링크·광고·개인 번호에서 와서 <b>세지 않은 문자 ${M.suspect}통</b>이 있어요. 가짜 입금 문자일 수 있으니 은행 앱에서 꼭 확인하세요.</div>`;
  h+=`<div class="mnote">계좌번호는 화면에 보여 주지 않아요. ${esc(M.note)} 은행이 문자 형식을 바꾸면 틀릴 수 있어요.</div>`;
 }
 L.innerHTML=h}
function wonShort(v){v=+v||0;if(v<10000)return v.toLocaleString('ko-KR')+'원';const e=Math.floor(v/1e8),m=Math.floor(v%1e8/1e4),r=v%1e4;let s='';if(e)s+=e.toLocaleString('ko-KR')+'억';if(m)s+=(s?' ':'')+m.toLocaleString('ko-KR')+'만';return r?s+' '+r.toLocaleString('ko-KR')+'원':s+' 원'}

/* ---------- 화면 전환 · 안드로이드 신호 ---------- */
function show(v){cur=v;menuClose();$('#toast').classList.remove('on');['list','conv','new','set','money'].forEach(k=>$('#v-'+k).hidden=k!==v);if(v==='set')renderSettings();if(v==='list'){pendRender();moneyBar()}if(v==='money')moneyView();if(v!=='conv'&&NV)NV.viewing('')}
function goList(){CONV=null;show('list');renderList()}
function refresh(){status();pendRender();loadMoney();if(cur==='list')moneyBar();if(cur==='money')moneyView();loadThreads();if(cur==='list')renderList();else if(cur==='conv')loadMsgs(false);else if(cur==='new')renderNew()}
window.NV_refresh=refresh;
window.NV_back=()=>{if(closeSheet())return true;if(menuClose())return true;if(cur!=='list'){goList();return true}if($('#lQ').value){$('#lQ').value='';renderList();return true}return false};
window.NV_resume=(kind,ok)=>{const before=ST.def;status();loadContacts();refresh();
 if(cur==='set')renderSettings();
 if(kind==='role'&&roleAsked&&!ST.def){roleAsked=0;restrictedSheet('role')}
 else if(kind==='role'&&ST.def&&!before){roleAsked=0;toast('기본 문자 앱이 되었어요')}
 if(kind==='perm'&&permAsked&&ST.perms&&!ST.perms.read){permAsked=0;restrictedSheet('perm')}
 else if(kind==='perm')permAsked=0};
window.NV_intent=()=>{if(!NV)return;const o=J(NV.takeOpen(),null);if(!o||!o.addr)return;closeSheet();menuClose();
 if(o.addr==='#money'){openMoney('bills');return}
 if(o.addr==='*')openNew(o.body);else openAddr(o.addr.split(/[;,]/)[0],o.body)};
/* 시작 */
status();loadContacts();loadThreads();loadMoney();show('list');renderList();
if(NV&&permMissing().length&&!localStorage.getItem('nvAsked')){localStorage.setItem('nvAsked','1');permAsked=Date.now();NV.requestPerms()}
NV_intent();
calStatus();if(NV&&ST.def&&!CAL.asked&&!CAL.on&&NV.calSkip&&!localStorage.getItem('nvCalAsked')){localStorage.setItem('nvCalAsked','1');setTimeout(calAsk,900)}
</script>
