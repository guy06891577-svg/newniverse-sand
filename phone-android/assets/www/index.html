<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:">
<title>뉴니버스 전화</title>
<style>
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--a1:#6fd3ff;--a2:#8f6bff;--acc:linear-gradient(135deg,var(--a1),var(--a2));--red:#ff4d6d;--fg:#f3f1ff;--sub:rgba(226,222,255,.62);--dim:rgba(226,222,255,.38);
 --glass:rgba(255,255,255,.075);--glass2:rgba(255,255,255,.12);--line:rgba(255,255,255,.14);--r:22px;
 --font:"Pretendard","Noto Sans KR","Apple SD Gothic Neo",system-ui,-apple-system,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#04030c;color:var(--fg);font-family:var(--font);overflow:hidden}
button,input{font-family:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
svg{display:block}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:#05040f}
@media (min-width:9999px){#app{width:390px;height:min(844px,calc(100% - 40px));border-radius:44px;border:1px solid rgba(255,255,255,.12);box-shadow:0 30px 90px rgba(80,60,200,.25),0 0 0 10px #0b0a18,0 0 0 11px rgba(255,255,255,.08)}
 #cap{display:block!important}}
#cap{display:none;position:fixed;left:0;right:0;bottom:6px;text-align:center;font-size:12px;color:var(--dim)}
#neb{position:absolute;inset:0;width:100%;height:100%}
.view{position:absolute;inset:0;display:flex;flex-direction:column;padding-top:calc(var(--sat) + 10px)}
.view[hidden]{display:none}
.sbar{display:flex;justify-content:space-between;align-items:center;padding:4px 24px 0;font-size:13px;font-weight:600;color:var(--sub);height:22px}
.mock{margin:8px 16px 0;padding:6px 12px;border-radius:12px;font-size:11.5px;color:var(--sub);background:rgba(143,107,255,.12);border:1px solid rgba(143,107,255,.25);display:flex;gap:6px;align-items:center}
.mock b{color:var(--a1);font-weight:700}
h1{font-size:26px;font-weight:800;letter-spacing:-.5px;padding:14px 22px 6px;display:flex;align-items:baseline;gap:8px}
h1 small{font-size:13px;font-weight:600;color:var(--sub)}
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2)}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 14px 110px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
/* tab bar */
#tabs{position:absolute;left:14px;right:14px;bottom:calc(var(--sab) + 14px);height:64px;border-radius:24px;display:flex;z-index:5;padding:6px}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--dim);border-radius:18px;position:relative}
#tabs button svg{width:22px;height:22px}
#tabs button.on{color:var(--fg);background:rgba(255,255,255,.08)}
#tabs button.on svg{stroke:url(#gacc)}
#tabs .badge{position:absolute;top:8px;left:calc(50% + 6px);width:7px;height:7px;border-radius:50%;background:var(--red)}
/* keypad */
#kpTop{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:0 18px 6px;min-height:0}
#matches{display:flex;flex-direction:column;gap:6px;overflow:hidden}
.mrow{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:18px}
.mrow .nm{font-size:16px;font-weight:700}
.mrow .nm em,.srow em{font-style:normal;color:var(--a1)}
.mrow .no{font-size:12.5px;color:var(--sub);margin-top:2px}
.mrow .no em{font-style:normal;color:var(--a1);font-weight:700}
.mrow .grow{flex:1;min-width:0}
.mmore{font-size:12px;color:var(--sub);text-align:center;padding:2px}
.hint{font-size:12.5px;color:var(--dim);text-align:center;padding:8px 0;line-height:1.5}
#num{font-size:36px;font-weight:300;letter-spacing:1.5px;text-align:center;min-height:52px;padding-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#num .ph{color:var(--dim);font-size:16px;letter-spacing:0}
#keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 18px;padding:6px 34px 0}
.key{height:62px;border-radius:31px;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:background .12s}
.key:active,.key.pr{background:rgba(255,255,255,.16)}
.key b{font-size:27px;font-weight:400;line-height:1}
.key i{font-style:normal;font-size:11px;color:var(--sub);letter-spacing:2px;margin-top:3px;height:13px}
#kpAct{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding:12px 34px calc(var(--sab) + 92px);align-items:center;justify-items:center}
.callbtn{width:66px;height:66px;border-radius:50%;background:var(--acc);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 30px rgba(111,160,255,.45)}
.callbtn svg{width:28px;height:28px;stroke:#0a0820}
.icb{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--sub)}
.icb svg{width:24px;height:24px}
/* avatar */
.av{width:42px;height:42px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(160,190,255,.35);position:relative}
.av.unk{color:var(--sub)}
.av svg{width:20px;height:20px}
.dot{position:absolute;top:-1px;right:-1px;width:11px;height:11px;border-radius:50%;background:var(--red);border:2px solid #0b0a1c}
/* recents */
.stat{font-size:12px;color:var(--sub);padding:0 22px 8px;display:flex;gap:6px;align-items:center}
.stat b{color:var(--fg)}
.seg{display:flex;gap:6px;padding:0 18px 10px}
.seg button{padding:7px 14px;border-radius:16px;font-size:13px;font-weight:600;color:var(--sub);border:1px solid var(--line)}
.seg button.on{color:#0a0820;background:var(--acc);border-color:transparent}
.day{font-size:12.5px;font-weight:700;color:var(--sub);padding:14px 8px 6px;display:flex;justify-content:space-between}
.day span{font-weight:500;color:var(--dim)}
.card{border-radius:var(--r);overflow:hidden}
.grp{position:relative;border-bottom:1px solid rgba(255,255,255,.06)}
.grp:last-child{border-bottom:none}
.rowc{position:relative;overflow:hidden}
.under{position:absolute;inset:0;display:flex;justify-content:flex-end}
.under button{width:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11.5px;font-weight:700}
.under .ucall{background:linear-gradient(135deg,rgba(111,211,255,.9),rgba(143,107,255,.9));color:#0a0820}
.under .udel{background:var(--red);color:#fff}
.under svg{width:22px;height:22px}
.front{position:relative;display:flex;align-items:center;gap:12px;padding:12px 10px 12px 14px;background:#100e24;touch-action:pan-y;transition:transform .22s ease;user-select:none}
.front .grow{flex:1;min-width:0}
.front .nm{font-size:16px;font-weight:700;display:flex;align-items:center;gap:6px;white-space:nowrap}
.front .nm.miss{color:#ff8da0}
.front .meta{font-size:12.5px;color:var(--sub);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.front .meta .m{color:#ff8da0;font-weight:600}
.cnt{font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px;background:rgba(255,255,255,.1);color:var(--fg)}
.qcall{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);color:var(--a1)}
.qcall svg{width:20px;height:20px}
.chev{color:var(--dim);transition:transform .2s}
.chev svg{width:18px;height:18px}
.grp.open .chev{transform:rotate(180deg)}
.det{display:none;background:rgba(0,0,0,.25);padding:6px 14px 12px 68px}
.grp.open .det{display:block}
.tl{position:relative;padding-left:16px}
.tl:before{content:"";position:absolute;left:4px;top:10px;bottom:10px;width:1px;background:linear-gradient(var(--a1),var(--a2));opacity:.5}
.ci{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:13.5px;position:relative}
.ci:before{content:"";position:absolute;left:-15px;width:7px;height:7px;border-radius:50%;background:var(--a1)}
.ci.miss:before,.ci.rej:before{background:var(--red)}
.ci svg{width:16px;height:16px;color:var(--sub)}
.ci.miss svg,.ci.miss .ty{color:#ff8da0}
.ci .tm{width:74px;font-variant-numeric:tabular-nums;color:var(--fg)}
.ci .ty{flex:1;color:var(--sub)}
.ci .du{color:var(--dim);font-variant-numeric:tabular-nums;font-size:12.5px}
.dact{display:flex;gap:8px;margin-top:8px}
.dact button{flex:1;height:38px;border-radius:14px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600}
.dact button svg{width:16px;height:16px}
.dact .pri{background:var(--acc);color:#0a0820;border:none}
.dact .del{color:#ff8da0}
.more{width:100%;margin:14px 0 4px;height:46px;border-radius:16px;font-size:13.5px;font-weight:600;color:var(--sub)}
.swhint{font-size:11.5px;color:var(--dim);text-align:center;padding:10px 0 0}
/* search */
.sbox{margin:4px 16px 8px;height:50px;border-radius:25px;display:flex;align-items:center;gap:10px;padding:0 18px}
.sbox svg{width:20px;height:20px;color:var(--sub)}
.sbox input{flex:1;background:none;border:none;outline:none;font-size:16px}
.sbox input::placeholder{color:var(--dim)}
.sec{display:flex;align-items:baseline;gap:6px;padding:14px 8px 8px;font-size:15px;font-weight:800}
.sec small{font-size:12.5px;font-weight:600;color:var(--a1)}
.sec .r{margin-left:auto;font-size:12px;font-weight:500;color:var(--dim)}
.srow{display:flex;align-items:center;gap:12px;padding:11px 12px;border-bottom:1px solid rgba(255,255,255,.06)}
.srow:last-child{border-bottom:none}
.srow .nm{font-size:16px;font-weight:700;display:flex;align-items:center;gap:7px}
.srow .no{font-size:12.5px;color:var(--sub);margin-top:2px}
.srow .grow{flex:1;min-width:0}
.n15{font-size:11.5px;font-weight:800;min-width:24px;text-align:center;padding:1px 7px;border-radius:10px;color:#0a0820;background:var(--acc)}
.bar{height:3px;border-radius:2px;background:var(--acc);margin-top:6px;opacity:.75}
/* call screens */
.full{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;padding:calc(var(--sat) + 40px) 24px calc(var(--sab) + 36px);background:radial-gradient(120% 70% at 50% 25%,rgba(70,60,170,.35),rgba(5,4,15,.55))}
.full[hidden]{display:none}
.clabel{font-size:13px;font-weight:600;color:var(--a1);letter-spacing:.5px;display:flex;align-items:center;gap:6px}
.clabel svg{width:15px;height:15px}
.bigav{width:118px;height:118px;border-radius:50%;margin:34px 0 20px;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:700;position:relative;background:rgba(255,255,255,.06);border:1.5px solid rgba(160,190,255,.5)}
.ring{position:absolute;inset:-2px;border-radius:50%;border:1.5px solid var(--a1);animation:ring 2.4s ease-out infinite;opacity:0}
.ring.b{animation-delay:.8s;border-color:var(--a2)}.ring.c{animation-delay:1.6s}
@keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.9);opacity:0}}
.cname{font-size:30px;font-weight:800;letter-spacing:-.5px}
.cnum{font-size:15px;color:var(--sub);margin-top:6px}
.cctx{margin-top:16px;font-size:12.5px;color:var(--sub);padding:7px 14px;border-radius:14px}
.cctx b{color:var(--fg)}
.spacer{flex:1}
.qr{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:26px}
.qr button{padding:9px 14px;border-radius:16px;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--glass)}
.ansrow{display:flex;justify-content:space-between;width:100%;padding:0 22px;align-items:flex-end}
.ab{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--sub)}
.ab .c{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.ab .c svg{width:30px;height:30px}
.ab .dec{background:var(--red)}
.ab .dec svg{stroke:#fff;transform:rotate(135deg)}
.ab .ans{background:var(--acc);box-shadow:0 0 0 0 rgba(111,211,255,.5);animation:pulse 1.8s infinite}
.ab .ans svg{stroke:#0a0820}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(111,211,255,.55)}100%{box-shadow:0 0 0 22px rgba(111,211,255,0)}}
.swipeup{font-size:12px;color:var(--dim);margin-top:18px;display:flex;align-items:center;gap:6px}
.swipeup svg{width:14px;height:14px}
#tmr{font-size:16px;color:var(--a1);margin-top:8px;font-variant-numeric:tabular-nums;font-weight:600}
.rec{display:none;margin-top:12px;font-size:12.5px;font-weight:700;color:#ff8da0;padding:5px 12px;border-radius:12px;background:rgba(255,77,109,.12);border:1px solid rgba(255,77,109,.35);align-items:center;gap:6px}
.rec.on{display:flex}
.rec i{width:8px;height:8px;border-radius:50%;background:var(--red);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
#ctl{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 14px;width:100%;padding:0 6px;margin-bottom:28px}
.cb{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--sub)}
.cb .c{width:68px;height:68px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--glass2);border:1px solid var(--line);transition:all .15s}
.cb .c svg{width:26px;height:26px;stroke:var(--fg)}
.cb.on .c{background:var(--acc);border-color:transparent}
.cb.on .c svg{stroke:#0a0820}
.cb.on{color:var(--fg)}
.cb.recon .c{background:rgba(255,77,109,.2);border-color:var(--red)}
.cb.recon .c svg{stroke:#ff8da0}
.endc{width:74px;height:74px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 30px rgba(255,77,109,.4)}
.endc svg{width:30px;height:30px;stroke:#fff;transform:rotate(135deg)}
#dtmf{display:none;width:100%;margin-bottom:16px}
#dtmf.on{display:block}
#dtmfNum{text-align:center;font-size:26px;letter-spacing:3px;min-height:34px;color:var(--fg)}
#dtmf .kg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 22px;padding:6px 30px}
#dtmf .key{height:56px}
#dtmf .hide{display:block;margin:6px auto 0;font-size:13px;color:var(--a1);font-weight:600}
#sheet{position:absolute;left:12px;right:12px;bottom:calc(var(--sab) + 14px);border-radius:26px;padding:18px;z-index:30;transform:translateY(calc(100% + var(--sab) + 60px));visibility:hidden;transition:transform .25s,visibility 0s .25s}
#sheet.on{transform:none;visibility:visible;transition:transform .25s}
#sheet h3{font-size:16px;margin-bottom:10px}
#sheet .opt{display:flex;align-items:center;gap:12px;width:100%;padding:12px 6px;font-size:15px;font-weight:600;border-bottom:1px solid rgba(255,255,255,.07);text-align:left}
#sheet .opt svg{width:20px;height:20px;color:var(--a1)}
#sheet .opt:last-child{border-bottom:none}
#toast{position:absolute;left:50%;bottom:calc(var(--sab) + 92px);transform:translateX(-50%) translateY(20px);opacity:0;z-index:40;padding:10px 16px;border-radius:18px;font-size:13.5px;font-weight:600;display:flex;gap:14px;align-items:center;white-space:nowrap;transition:all .2s;pointer-events:none;background:rgba(24,20,52,.92);border:1px solid var(--line)}
#toast.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
#toast button{color:var(--a1);font-weight:700;font-size:13.5px}
.view{padding-top:calc(var(--sat) + 6px)}
.sbar{display:none}
h1{padding-top:12px}
.banner{margin:4px 14px 8px;padding:12px 14px;border-radius:18px;display:flex;align-items:center;gap:12px;font-size:13px;line-height:1.45;color:var(--sub)}
.banner b{color:var(--fg);display:block;font-size:14px}
.banner .grow{flex:1}
.banner button{flex:none;padding:9px 14px;border-radius:14px;font-size:13px;font-weight:700;color:#0a0820;background:var(--acc)}
.banner.warn{border-color:rgba(255,77,109,.35)}
#incallBar{position:absolute;left:14px;right:14px;top:calc(var(--sat) + 8px);z-index:6;display:none;padding:10px 14px;border-radius:16px;background:var(--acc);color:#0a0820;font-weight:700;font-size:14px;align-items:center;gap:8px}
#incallBar.on{display:flex}
#incallBar svg{width:18px;height:18px}
#matches{max-height:100%;overflow-y:auto;scrollbar-width:none}
#matches::-webkit-scrollbar{display:none}
.mrow .tag{font-size:11px;color:var(--dim);margin-left:4px;font-weight:500}
.empty{padding:40px 20px;text-align:center;color:var(--sub);font-size:14px;line-height:1.6}
.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:6px}
.empty button{margin-top:14px;padding:11px 18px;border-radius:16px;font-weight:700;color:#0a0820;background:var(--acc);font-size:14px}
.sec .clr{margin-left:auto;font-size:12px;color:var(--a1);font-weight:600}
.srow .x{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--dim)}
.srow .x svg{width:16px;height:16px}
/* settings */
.set{border-radius:var(--r);padding:6px 14px;margin-bottom:12px}
.set h3{font-size:13px;font-weight:700;color:var(--sub);padding:10px 2px 4px}
.srow2{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid rgba(255,255,255,.06);font-size:14.5px}
.srow2:last-child{border-bottom:none}
.srow2 .grow{flex:1}
.srow2 small{display:block;font-size:12px;color:var(--sub);margin-top:2px;line-height:1.45}
.ok{color:var(--a1);font-weight:700;font-size:13px}
.no{color:#ff8da0;font-weight:700;font-size:13px}
.sbtn{padding:8px 13px;border-radius:13px;font-size:13px;font-weight:700;border:1px solid var(--line)}
.sbtn.pri{background:var(--acc);color:#0a0820;border:none}
.steps{font-size:13px;color:var(--sub);line-height:1.7;padding:4px 2px 10px}
.steps b{color:var(--fg)}
.steps ol{padding-left:18px}
/* sheet (contact actions) */
#sheet .who{display:flex;align-items:center;gap:12px;margin-bottom:8px}
#sheet .who .nm{font-size:18px;font-weight:800}
#sheet .who .no{font-size:13px;color:var(--sub)}
#bd{position:absolute;inset:0;z-index:25;background:rgba(0,0,0,.4);display:none}
#bd.on{display:block}
h1.sub{align-items:center;padding-left:8px;gap:4px;font-size:22px}h1.sub .icb{width:44px;height:44px;color:var(--fg)}h1.sub .icb svg{width:24px;height:24px}
#tabs button{min-width:0}
h1 small{font-size:13px;font-weight:600;color:var(--sub)}
#v-search{position:absolute}
.sbox .x[hidden]{display:none}.srow .nm .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbox .x{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--dim)}.sbox .x svg{width:16px;height:16px}
.ix{position:sticky;top:0;z-index:2;margin:0 -4px;padding:9px 12px 7px;font-size:13px;font-weight:800;color:var(--a1);background:rgba(8,6,22,.72);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:12px}
.ix+.card{margin-top:4px}
#abIdx[hidden]{display:none}
.sbox input{min-width:0}
#sList.abl{padding-right:34px}
.srow.abr{cursor:pointer}.srow.abr:active{background:rgba(143,107,255,.1)}
.srow.abr .ph{flex:none;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--a1);opacity:.85}.srow.abr .ph svg{width:18px;height:18px}
#abIdx{position:absolute;right:4px;top:150px;bottom:calc(var(--sab) + 96px);width:26px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:0;z-index:4;touch-action:none;border-radius:13px}
#abIdx b{flex:1;max-height:24px;display:flex;align-items:center;justify-content:center;width:100%;font-size:11.5px;font-weight:700;color:var(--sub)}

/* ---------- nebula ---------- */
function nebula(){const c=$('#neb'),r=c.getBoundingClientRect();if(!r.width)return;const d=Math.min(2,devicePixelRatio||1);c.width=r.width*d;c.height=r.height*d;const x=c.getContext('2d');x.scale(d,d);const W=r.width,H=r.height;
 x.fillStyle='#05040f';x.fillRect(0,0,W,H);let s=7;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
 const blob=(cx,cy,rr,col)=>{const g=x.createRadialGradient(cx,cy,0,cx,cy,rr);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,W,H)};
 blob(W*.15,H*.12,W*.9,'rgba(60,120,220,.30)');blob(W*.95,H*.35,W*.85,'rgba(130,80,230,.30)');blob(W*.3,H*.8,W*.9,'rgba(90,60,200,.22)');blob(W*.7,H*.95,W*.6,'rgba(60,170,240,.14)');
 for(let i=0;i<14;i++)blob(W*rnd(),H*rnd(),W*(.1+rnd()*.25),`rgba(${110+rnd()*60|0},${110+rnd()*60|0},255,.07)`);
 for(let i=0;i<170;i++){const a=rnd()*.7+.1,rr=rnd()*1.1+.2;x.fillStyle=`rgba(230,235,255,${a})`;x.beginPath();x.arc(W*rnd(),H*rnd(),rr,0,7);x.fill()}

/* ---------- 번호 ---------- */
const digits=s=>String(s||'').replace(/\D/g,'');
function norm(n){let s=String(n||'').replace(/[^\d+]/g,'');if(s.startsWith('+82'))s='0'+s.slice(3);else if(s.startsWith('82')&&s.length>=11&&s[2]==='1')s='0'+s.slice(2);return s.replace(/\D/g,'')}
function fmt(n){const raw=String(n||'');if(/[*#,;]/.test(raw))return raw;const d=norm(raw);const L=d.length;if(!L)return raw;
 if(d.startsWith('02')){if(L<=2)return d;if(L<=5)return d.slice(0,2)+'-'+d.slice(2);if(L<=9)return d.slice(0,2)+'-'+d.slice(2,L-4)+'-'+d.slice(-4);return d.slice(0,2)+'-'+d.slice(2,6)+'-'+d.slice(6)}
 if(/^1[5-9]\d{2}/.test(d)&&L<=8)return L>4?d.slice(0,4)+'-'+d.slice(4):d;

 return d}
const fmtTyping=s=>/^[\d]+$/.test(s)?fmt(s):s;

const NORMC={ㄲ:'ㄱ',ㄸ:'ㄷ',ㅃ:'ㅂ',ㅆ:'ㅅ',ㅉ:'ㅈ'};
const cho=s=>[...String(s)].map(ch=>{const c=ch.charCodeAt(0)-0xAC00;if(c<0||c>11171)return NORMC[ch]||ch.toLowerCase();const k=CHO[Math.floor(c/588)];return NORMC[k]||k}).join('');
const KEY={'1':'ㄱㅋ','2':'ㄴㄹ','3':'ㄷㅌ','4':'ㅂㅍ','5':'ㅅㅎ','6':'ㅈㅊ','7':'ㅇㅁ','8':'','9':'','0':'+','*':'','#':''};
const K2D={};Object.entries(KEY).forEach(([d,s])=>[...s].forEach(c=>{if(c!=='+')K2D[c]=d}));
const choDigits=name=>[...cho(name)].map(c=>K2D[c]||'·').join('');
const hl=(s,r)=>r?esc(s.slice(0,r[0]))+'<em>'+esc(s.slice(r[0],r[0]+r[1]))+'</em>'+esc(s.slice(r[0]+r[1])):esc(s);
function hlNum(num,q){const f=fmt(num);if(!q||q.length<2)return esc(f);const d=digits(f),j=d.indexOf(q);if(j<0)return esc(f);let k=0,st=-1,en=-1;for(let x=0;x<f.length;x++){if(/\d/.test(f[x])){if(k===j)st=x;if(k===j+q.length-1){en=x;break}k++}}return hl(f,[st,en-st+1])}

const DAY=864e5;let today=0;const setToday=()=>{const d=new Date();d.setHours(0,0,0,0);today=d.getTime()};setToday();

  if(!NV||!NV.cardScan){toast('폰 앱 안에서만 쓸 수 있어요');return}
  CD={st:'reading',f:{},lines:[]};cur==='card'?renderCard():go('card');NV.cardScan(a)}}
window.NV_card=r=>{if(!r||!r.ok){const e=r&&r.err;
  if(e==='cancel'){if(cur==='card'&&CD&&CD.st==='reading'){CD=null;goBack()}return}
  CD={st:'form',f:{},lines:[],guess:{},err:e==='nocam'?'카메라 앱을 열 수 없어요. 「사진에서 고르기」를 써 보세요':e==='nogallery'?'사진 앱을 열 수 없어요':'글자를 읽지 못했어요. 밝은 곳에서 명함이 화면에 가득 차게 다시 찍거나, 직접 입력해 주세요'};
  cur==='card'?renderCard():go('card');return}
 const lines=r.lines||[];
 CD={st:'form',f:{name:r.name||'',mobile:r.mobile||'',tel:r.tel||'',company:r.company||'',title:r.title||'',email:r.email||''},guess:{name:!!r.nameGuess,company:!!r.companyGuess},lines,
  err:lines.length?'':'명함에서 글자를 찾지 못했어요. 다시 찍거나 직접 입력해 주세요'};
 cdFocus=!CD.f.name?'name':!CD.f.mobile?'mobile':'company';
 cur==='card'?renderCard():go('card')};
function renderCard(){const el=$('#cdList');if(!CD){el.innerHTML='';return}
 if(CD.st==='reading'){el.innerHTML=`<div class="empty"><div class="spin"></div><b>명함 읽는 중…</b>폰 안에서만 읽어요. 사진은 저장하지 않아요</div>`;return}
 let h=CD.err?`<div class="banner glass warn"><div class="grow">${esc(CD.err)}</div></div>`:`<div class="hint">읽은 내용이 맞는지 꼭 확인해 주세요 · 틀린 칸은 눌러서 고쳐요</div>`;
 h+='<div class="set glass">'+CDF.map(([k,l,ph])=>`<label class="cdr"><span class="cdl">${l}${CD.guess&&CD.guess[k]&&CD.f[k]?'<i>맞는지 확인</i>':''}</span><input data-f="${k}" value="${esc(CD.f[k]||'')}" placeholder="${ph}" ${k==='mobile'||k==='tel'?'inputmode="tel"':k==='email'?'inputmode="email"':''} autocomplete="off" maxlength="120"></label>`).join('')+'</div>';
 h+='<div id="cdDup"></div>';
 if(CD.lines.length)h+=`<div class="sec">명함에서 읽은 글 <small>누르면 <b id="cdFl">${(CDF.find(x=>x[0]===cdFocus)||CDF[0])[1]}</b> 칸에 넣어요</small></div><div class="cdlines">${CD.lines.map((t,i)=>`<button data-ln="${i}">${esc(t)}</button>`).join('')}</div>`;
 h+=`<button class="smok" data-cd="save">주소록에 저장</button><button class="cdre" data-cd="again">${ic('cam')}다시 찍기</button>`;
 el.innerHTML=h;cdDup()}
function cdDup(){const d=$('#cdDup');if(!d||!CD)return;const k=norm(CD.f.mobile||'')||norm(CD.f.tel||'');const nm=k&&CMAP.get(k);
 d.innerHTML=nm?`<div class="banner glass"><div class="grow"><b>이미 주소록에 있는 번호예요</b>${esc(nm)} · 저장하면 연락처가 하나 더 생겨요</div></div>`:''}
$('#cdList').addEventListener('input',e=>{const f=e.target.dataset&&e.target.dataset.f;if(!f||!CD)return;CD.f[f]=e.target.value;if(f==='mobile'||f==='tel')cdDup()});
$('#cdList').addEventListener('focusin',e=>{const f=e.target.dataset&&e.target.dataset.f;if(!f)return;cdFocus=f;const l=$('#cdFl');if(l)l.textContent=(CDF.find(x=>x[0]===f)||CDF[0])[1]});
$('#cdList').addEventListener('pointerdown',e=>{if(e.target.closest('[data-ln]'))e.preventDefault()});   // 줄을 눌러도 칸 포커스가 안 빠지게
$('#cdList').addEventListener('click',e=>{const ln=e.target.closest('[data-ln]');if(ln&&CD){let t=CD.lines[+ln.dataset.ln]||'';
  if(cdFocus==='mobile'||cdFocus==='tel'){const m=/(\+?\d[\d\s.\-()]{6,}\d)/.exec(t);if(m)t=fmt(m[1])}else if(cdFocus==='email'){const u=t.replace(/\s*([@.])\s*/g,'$1').replace(/(@[\w\-]+(?:\.[\w\-]+)+)\s+(kr|com|net|org)\b/i,'$1.$2');const m=/[\w.%+\-]+@[\w\-]+(\.[\w\-]+)+/.exec(u);if(m)t=m[0]}
  CD.f[cdFocus]=t;const inp=$(`#cdList input[data-f="${cdFocus}"]`);if(inp){inp.value=t;inp.focus()}if(cdFocus==='mobile'||cdFocus==='tel')cdDup();buzz();return}
 const b=e.target.closest('[data-cd]');if(!b)return;buzz();if(b.dataset.cd==='again'){cardStart();return}cardSave()});
function cdFields(){const f={};CDF.forEach(([k])=>f[k]=String((CD&&CD.f[k])||'').trim());return f}
function cardSave(){if(!NV)return;const f=cdFields();if(!f.name&&!f.mobile&&!f.tel){toast('이름이나 번호를 하나는 넣어 주세요');return}
 const r=NV.cardSave(JSON.stringify(f));
 if(r==='ok'){toast(`${f.name||fmt(f.mobile||f.tel)} 주소록에 저장했어요`);CD=null;NAV=[];load();show('search')}
 else if(r==='perm'){cdWait=true}
 else if(r==='empty')toast('이름이나 번호를 하나는 넣어 주세요');
 else toast('저장하지 못했어요','주소록 앱으로',()=>NV.cardInsert(JSON.stringify(f)),5000)}
function cardPermBack(ok){if(!cdWait)return;cdWait=false;if(ok){cardSave();return}
 sheet(`<h3>연락처 저장을 허용하지 않았어요</h3><div class="steps2">허용하지 않아도 폰 <b>주소록 앱</b>의 새 연락처 화면에 지금 내용을 채워서 열 수 있어요.</div>
  <button class="opt pri" data-a="ins"><span data-i="book"></span>주소록 앱으로 열기</button><button class="opt" data-a="close"><span data-i="x"></span>닫기</button>`);
 $('#sheet').onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;closeSheet();if(b.dataset.a==='ins')NV.cardInsert(JSON.stringify(cdFields()))}}

// ---------- 일정 10분 전 회의 모드 ----------
let CI={};
function calLoad(){CI=NV&&NV.calInfo?J(()=>NV.calInfo(),{}):{}}
function calBanner(){if(!CI||!CI.key)return '';
 return `<div class="banner glass mdban on" id="calBan"><div class="mdi">${ic('cal')}</div><div class="grow"><b>곧 일정 · ${esc(CI.title||'일정')} <span style="white-space:nowrap">${esc(hm(CI.begin))}</span></b>회의 모드 켤까요? 끝나는 <span style="white-space:nowrap">${esc(hm(CI.end))}</span>에 저절로 꺼져요</div><button data-cal="on">켜기</button><button class="sbtn" data-cal="no" style="background:none;color:var(--fg)">괜찮아요</button></div>`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-cal]');if(!b||!NV)return;e.stopPropagation();buzz();const k=CI.key;
 if(b.dataset.cal==='on'){const r=J(()=>NV.calOn(k,CI.end),{});mdLoad();calLoad();toast(r.ok?'회의 모드를 켰어요 · 일정이 끝나면 저절로 꺼져요':'켜지 못했어요')}
 else{NV.calNo(k);calLoad();toast('이번 일정은 묻지 않을게요')}
 if(cur==='recent')$('#rBanner').innerHTML=banners()},true);
setInterval(()=>{if(!NV||document.hidden||MODE!=='main'||cur!=='recent')return;const was=CI.key;calLoad();if(was!==CI.key)$('#rBanner').innerHTML=banners()},30000);

// ---------- 큰 버튼 화면 (부모님용) ----------
const BIG_KEY='nvp_big';
function bigGet(){try{const o=JSON.parse(localStorage.getItem(BIG_KEY)||'{}');return {on:!!o.on,people:Array.isArray(o.people)?o.people.slice(0,4):[]}}catch(e){return {on:false,people:[]}}}
function bigPut(o){try{localStorage.setItem(BIG_KEY,JSON.stringify({on:!!o.on,people:o.people.slice(0,4)}))}catch(e){}}
const bigOn=()=>bigGet().on;
function bp(x){const nm=CMAP.get(x.key)||x.name||'';return {key:x.key,name:nm||fmt(x.num),num:x.num,unk:!nm}}
function bigSuggest(){const m=new Map();CALLS.forEach(c=>{if(c.p.hidden||!c.p.key||(c.type!=='in'&&c.type!=='out'))return;if(dayOff(c.t)>30)return;const g=m.get(c.p.key)||{key:c.p.key,num:c.p.num,name:c.p.unk?'':c.p.name,unk:c.p.unk,n:0};g.n++;m.set(c.p.key,g)});
 return [...m.values()].sort((a,b)=>(a.unk-b.unk)||b.n-a.n).map(g=>Object.assign(bp(g),{n:g.n}))}
function renderBig(){const B=bigGet(),el=$('#bgList');
 if(!B.people.length){el.innerHTML=`<div class="empty"><b>큰 버튼에 넣을 사람을 골라 주세요</b>자주 거는 3~4명을 고르면 크게 보여요<br><button data-b="bigset">사람 고르기</button></div>`;return}
 const nmC={};B.people.forEach(x=>{const k=bp(x).name;nmC[k]=(nmC[k]||0)+1});
 el.innerHTML=B.people.map((x,i)=>{const p=bp(x);const dup=nmC[p.name]>1&&!p.unk;const miss=CALLS.some(c=>c.p.key===x.key&&c.type==='miss'&&dayOff(c.t)===0);
  return `<button class="bgb glass" data-bg="${i}" aria-label="${esc(p.name)}에게 전화"><span class="bgav">${p.unk?ic('user'):esc([...p.name][0]||'')}</span><span class="grow"><span class="bgn">${esc(p.name)}</span>${dup?`<span class="bgno">${esc(fmt(x.num))}</span>`:''}<span class="bgs">${miss?'<i class="mdot"></i>오늘 못 받은 전화 · ':''}누르면 바로 전화</span></span><span class="bgc">${ic('phone',2)}</span></button>`}).join('')}
$('#bgList').addEventListener('click',e=>{const b=e.target.closest('[data-bg]');if(!b)return;const x=bigGet().people[+b.dataset.bg];if(!x)return;buzz();const p=bp(x);toast(`${p.name}에게 전화를 걸어요`);dial(x.num,p)});
$('#v-big').addEventListener('click',e=>{const b=e.target.closest('[data-bgv]');if(!b)return;buzz();NAV=[];show(b.dataset.bgv)});
function renderBigSet(){const B=bigGet(),el=$('#bsList');
 let h=`<div class="set glass"><div class="srow2"><div class="grow">큰 버튼 화면 쓰기<small>켜면 앱을 열 때 큰 버튼 화면부터 보여요. 끄면 지금 화면 그대로예요.</small></div><button class="tg" role="switch" aria-checked="${B.on}" data-bigtg aria-label="큰 버튼 화면 쓰기"></button></div></div>`;
 h+=`<div class="sec">버튼에 넣을 사람 <small>${B.people.length}/4</small></div>`;
 h+=B.people.length?'<div class="card glass">'+B.people.map((x,i)=>{const p=bp(x);return `<div class="srow" data-bi="${i}">${avHtml(p)}<div class="grow"><div class="nm"><span class="t">${esc(p.name)}</span></div><div class="no">${esc(fmt(x.num))}</div></div>${i?`<button class="x" data-bm="up" aria-label="위로">${ic('up')}</button>`:''}<button class="x" data-bm="rm" aria-label="빼기">${ic('x')}</button></div>`}).join('')+'</div>':'<div class="hint">아래에서 3~4명을 골라 주세요</div>';
 if(B.people.length<4){const all=bigSuggest(),sug=all.filter(p=>!B.people.some(x=>x.key===p.key)).slice(0,8);
  h+=`<div class="sec">자주 통화한 사람 <small>최근 30일</small></div>`+(sug.length?'<div class="card glass bsl">'+sug.map(p=>`<div class="srow" data-ba="${esc(p.key)}" data-n="${esc(p.num)}" data-nm="${esc(p.unk?'':p.name)}">${avHtml(p)}<div class="grow"><div class="nm"><span class="t">${esc(p.name)}</span></div><div class="no">${esc(fmt(p.num))} · ${p.n}통</div></div><button class="ubtn">넣기</button></div>`).join('')+'</div>':`<div class="hint">${all.length?'더 넣을 사람이 없어요 · 아래에서 찾아 주세요':'최근 30일 통화가 없어요'}</div>`);
  h+=`<div class="sec">주소록에서 찾기</div><div class="sbox glass">${ic('search')}<input id="bsIn" placeholder="이름이나 번호" autocomplete="off"></div><div id="bsRes" class="bsl"></div>`}
 h+=`<button class="smok" data-bdone>${B.on?'큰 버튼 화면 보기':'완료'}</button>`;el.innerHTML=h;
 const si=$('#bsIn');if(si)si.oninput=()=>{const q=si.value.trim(),qc=cho(q),qd=digits(q);const B2=bigGet();if(!q){$('#bsRes').innerHTML='';return}
  const seen=new Set();const r=abPeople().filter(p=>{if(seen.has(p.key)||B2.people.some(x=>x.key===p.key))return false;const hit=p.name.includes(q)||(/^[ㄱ-ㅎ]+$/.test(q)&&cho(p.name).includes(qc))||(qd.length>=2&&digits(norm(p.num)).includes(qd));if(hit)seen.add(p.key);return hit}).slice(0,12);
  $('#bsRes').innerHTML=r.length?'<div class="card glass">'+r.map(p=>`<div class="srow" data-ba="${esc(p.key)}" data-n="${esc(p.num)}" data-nm="${esc(p.name)}">${avHtml(p)}<div class="grow"><div class="nm"><span class="t">${esc(p.name)}</span></div><div class="no">${esc(fmt(p.num))}</div></div><button class="ubtn">넣기</button></div>`).join('')+'</div>':'<div class="hint">찾는 사람이 없어요</div>'}}
$('#bsList').addEventListener('click',e=>{const B=bigGet();
 if(e.target.closest('[data-bigtg]')){buzz();B.on=!B.on;bigPut(B);renderBigSet();toast(B.on?(B.people.length?'큰 버튼 화면을 켰어요':'켰어요 · 이제 사람을 골라 주세요'):'큰 버튼 화면을 껐어요');return}
 if(e.target.closest('[data-bdone]')){buzz();if(B.on){NAV=[];show('big')}else goBack();return}
 const a=e.target.closest('[data-ba]');if(a){if(B.people.length>=4){toast('4명까지 넣을 수 있어요');return}buzz();B.people.push({key:a.dataset.ba,num:a.dataset.n,name:a.dataset.nm||''});bigPut(B);renderBigSet();return}
 const m=e.target.closest('[data-bm]');if(m){const i=+m.closest('[data-bi]').dataset.bi;buzz();if(m.dataset.bm==='rm')B.people.splice(i,1);else if(i>0){const t=B.people[i-1];B.people[i-1]=B.people[i];B.people[i]=t}bigPut(B);renderBigSet()}});

// ---------- 설정: v6 칸 ----------
function setV6(){const B=bigGet(),m=CI.mode||'ask';const nB=BK.size;
 return `<div class="set glass"><h3>통화 메모 · 차단 · 명함</h3>
  <div class="srow2"><div class="grow">통화 메모<small>15초 넘게 통화했거나 저장된 사람과 통화가 끝나면 「메모 남길까요?」를 물어요. 메모는 이 폰에만 저장돼요.</small></div><button class="sbtn pri" data-b="memos">열기</button></div>
  <div class="srow2"><div class="grow">차단 목록<small>${BI.can?'차단한 번호 '+nB+'개':'기본 전화 앱일 때만 차단할 수 있어요'}</small></div><button class="sbtn" data-b="blocks">열기</button></div>
  <div class="srow2"><div class="grow">명함으로 연락처 추가<small>글자는 폰 안에서만 읽고, 사진은 저장하지 않아요</small></div><button class="sbtn" data-b="card">시작</button></div>
 </div>
 <div class="set glass"><h3>일정 전 회의 모드</h3>
  <div class="srow2"><div class="grow">일정 시작 10분 전에 묻기<small>폰 달력(뉴니버스 달력 포함) 일정 전에 회의 모드를 켤지 물어요. 종일 일정, 3시간 넘는 일정, 운전 중일 때는 묻지 않아요.</small></div></div>
  <div class="mdsg" id="calSeg">${[['ask','묻기'],['auto','자동으로 켜기'],['off','끄기']].map(([k,l])=>`<button data-calm="${k}" class="${m===k?'on':''}">${l}</button>`).join('')}</div>
  ${m!=='off'&&CI.perm===false?'<div class="srow2"><div class="grow">달력 허용이 필요해요<small>일정 시간과 제목만 읽고, 밖으로 보내지 않아요</small></div><button class="sbtn pri" data-b="calask">허용</button></div>':''}
 </div>
 <div class="set glass"><h3>큰 버튼 화면 (부모님용)</h3>
  <div class="srow2"><div class="grow">자주 거는 사람을 큰 버튼으로<small>${B.on?'켜져 있어요 · 앱을 열면 큰 버튼 화면부터 보여요':'꺼져 있어요 · 지금 화면 그대로예요'}${B.people.length?' · '+B.people.map(x=>esc(bp(x).name)).join(', '):''}</small></div><button class="sbtn${B.on?'':' pri'}" data-b="bigset">${B.on?'바꾸기':'켜기'}</button></div>
 </div>`}
$('#setList').addEventListener('click',e=>{const b=e.target.closest('[data-calm]');if(!b||!NV)return;buzz();NV.calMode(b.dataset.calm);calLoad();if(b.dataset.calm!=='off'&&CI.perm===false)NV.calAsk();renderSettings()});

/* ---------- 시작 ---------- */
if(MODE==='call'){$('#tabs').style.display='none';VIEWS.forEach(x=>$('#v-'+x).hidden=true);if(NV){const s=J(()=>NV.state(),null);if(s)NV_call(s)}}
else{load();incallBar();setTimeout(moreDot,0);try{const P0=ST.perms||{};if(NV&&(!P0.log||!P0.contacts||!P0.phone)&&!localStorage.getItem('nvp_asked')){localStorage.setItem('nvp_asked','1');setTimeout(()=>NV.requestPerms(),600)}}catch(e){}let first='recent',mv='';if(NV){const v=NV.takeView(),d=NV.takeDial();if(v==='keypad'){first='keypad';num=d?String(d).replace(/[^\d+*#]/g,''):''}else if(v==='recent')first='recent';else if(v)mv=v}if(first==='recent'&&!mv&&bigOn())first='big';show(first);if(mv&&!v6View(mv))mdView(mv)}
window.__nvp={show,v6:()=>({cur,NAV,CD,BK:[...BK],mcE,VC:{on:VC.on,src:VC.src}}),mdState:()=>({MS,cur}),state:()=>({cur,num,calls:CALLS.length,rows:groups().reduce((s,d)=>s+d.gs.length,0)}),norm,fmt,cho,choDigits};
})();
