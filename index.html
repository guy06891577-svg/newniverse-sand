<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0820">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>뉴니버스 · 모래 전환 시제품 v8</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{height:100%;background:#05040d;overflow:hidden;font-family:system-ui,-apple-system,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#fff;overscroll-behavior:none}
  body{display:flex;align-items:center;justify-content:center}
  #phone{position:relative;width:100vw;height:100vh;height:100dvh;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  @media (min-width:700px){
    #phone{width:400px;height:min(860px,96vh);border-radius:44px;box-shadow:0 0 0 10px #16141f,0 0 0 12px #2b2838,0 30px 80px rgba(0,0,0,.7)}
    #hint-desktop{display:block!important}
  }
  #bg,#wp,#stars,#dune,#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
  #status{position:absolute;top:0;left:0;right:0;height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:13px;font-weight:600;z-index:5;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.4)}
  #status .r{display:flex;gap:6px;align-items:center;font-size:12px}
  #gear{position:absolute;top:40px;right:14px;width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;font-size:19px;z-index:6;display:flex;align-items:center;justify-content:center;cursor:pointer}
  #dots{position:absolute;left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:5;pointer-events:none}
  #dots i{width:7px;height:7px;border-radius:4px;background:rgba(255,255,255,.4);transition:all .35s}
  #dots i.on{width:20px;background:#fff}
  #dock{position:absolute;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));height:88px;border-radius:30px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:flex;justify-content:space-around;align-items:center;z-index:5}
  .dk{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;cursor:pointer}
  .dk b{width:54px;height:54px;border-radius:17px;display:flex;align-items:center;justify-content:center;font-size:27px;box-shadow:0 4px 12px rgba(0,0,0,.3)}
  #toast{position:absolute;left:50%;bottom:190px;transform:translateX(-50%) translateY(20px);background:rgba(20,18,35,.85);padding:10px 18px;border-radius:20px;font-size:13px;opacity:0;transition:all .3s;z-index:9;pointer-events:none;white-space:nowrap;border:1px solid rgba(255,255,255,.15)}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #sheet{position:absolute;left:0;right:0;bottom:0;z-index:10;max-height:86%;overflow-y:auto;touch-action:pan-y;overscroll-behavior:contain;background:rgba(18,15,34,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:26px 26px 0 0;padding:18px 22px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.9,.3,1);border-top:1px solid rgba(255,255,255,.15)}
  #sheet.open{transform:none}
  #sheet h3{font-size:17px;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center}
  #sheet h3 button{background:none;border:none;color:#aaa;font-size:22px;cursor:pointer}
  #sheet .sub{font-size:12px;color:#a9a3c9;margin-bottom:14px}
  .row{margin:12px 0}
  .row label{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
  .row label span{color:#e6c37a;font-variant-numeric:tabular-nums}
  .seg{display:flex;gap:6px;background:rgba(255,255,255,.08);padding:4px;border-radius:14px}
  .seg button{flex:1;padding:9px 4px;border:none;border-radius:10px;background:none;color:#cfc9ea;font-size:13px;font-weight:600;cursor:pointer}
  .seg button.on{background:linear-gradient(135deg,#e6b85c,#d9813b);color:#1a1205}
  input[type=range]{width:100%;accent-color:#e6b85c;height:28px}
  .btns{display:flex;gap:8px;margin-top:14px}
  .btns button{flex:1;padding:12px;border-radius:14px;border:none;font-size:14px;font-weight:600;cursor:pointer;background:rgba(255,255,255,.12);color:#fff}
  .btns button.p{background:linear-gradient(135deg,#e6b85c,#d9813b);color:#1a1205}
  #stats{font-size:11px;color:#8e88b0;margin-top:12px;text-align:center}
  #hint{position:absolute;left:0;right:0;text-align:center;font-size:12px;color:rgba(255,255,255,.75);z-index:5;pointer-events:none;transition:opacity 1s}
  #hint-desktop{display:none;position:fixed;bottom:12px;left:0;right:0;text-align:center;color:#777;font-size:12px}
  #fold{position:absolute;inset:0;z-index:8;display:none;touch-action:none}
  #fold .bd{position:absolute;inset:0;background:rgba(8,6,22,.45);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);opacity:0;transition:opacity .35s}
  #fold.open .bd{opacity:1}
  #fold .wrap{position:absolute;inset:0;transition:transform .42s cubic-bezier(.2,.9,.25,1.05),opacity .3s;opacity:0}
  #fold.open .wrap{opacity:1}
  #fold h2{position:absolute;left:0;right:0;top:20%;text-align:center;font-size:24px;font-weight:700;text-shadow:0 2px 10px rgba(0,0,0,.5)}
  #fold .stage{position:absolute;left:0;right:0;top:50%;height:0;perspective:900px}
  #fold .cd{position:absolute;left:50%;top:0;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:40px;display:flex;align-items:center;justify-content:center;font-size:76px;box-shadow:0 18px 40px rgba(0,0,0,.45);will-change:transform,opacity;backface-visibility:hidden}
  #fold .cd::after{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(rgba(255,255,255,.3),rgba(255,255,255,0) 55%);pointer-events:none}
  #fold .lbl{position:absolute;left:0;right:0;top:calc(50% + 110px);text-align:center;font-size:19px;font-weight:600;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #fold .fdots{position:absolute;left:0;right:0;top:calc(50% + 148px);display:flex;justify-content:center;gap:6px}
  #fold .fdots i{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.35);transition:all .2s}
  #fold .fdots i.on{background:#fff;width:16px}
  #fold .tip{position:absolute;left:0;right:0;bottom:16%;text-align:center;font-size:12px;color:rgba(255,255,255,.6)}
  #nogl{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;z-index:20;background:#0b0820}
</style>
</head>
<body>
<div id="phone">
  <canvas id="bg"></canvas>
  <div id="wp"></div>
  <canvas id="stars"></canvas>
  <canvas id="dune"></canvas>
  <canvas id="gl"></canvas>
  <div id="status"><span id="sbTime">12:00</span><span class="r">📶 <span>LTE</span> 🔋 <span>87%</span></span></div>
  <button id="gear" aria-label="설정">⚙️</button>
  <div id="hint">← 화면을 옆으로 밀어보세요 →</div>
  <div id="dots"><i class="on"></i><i></i><i></i></div>
  <div id="safe" style="position:absolute;visibility:hidden;padding-bottom:env(safe-area-inset-bottom)"></div>
  <div id="fold"><div class="bd"></div><div class="wrap"><h2></h2><div class="stage"></div><div class="lbl"></div><div class="fdots"></div><div class="tip">좌우로 휙 돌려보세요 · 아래로 내리거나 바깥을 누르면 닫혀요</div></div></div>
  <div id="toast"></div>
  <div id="sheet">
    <h3>모래 전환 설정 <button id="close">✕</button></h3>
    <div class="sub">값을 바꾸고 화면을 밀어보세요. 마음에 드는 조합을 찾아주세요.</div>
    <div class="row" style="margin-top:0"><label>배경화면</label><div class="seg" id="wpSeg" style="flex-wrap:wrap"></div></div>
    <div class="seg" id="styleSeg" style="flex-wrap:wrap"><button data-s="wind" style="flex-basis:100%">바람 한 방향 (흩날림→불어와 만들기)</button><button data-s="morph">흩어졌다 모이기</button><button data-s="dream">몽환</button><button data-s="storm">모래바람</button></div>
    <div class="row"><label>바람 세기 <span id="vWind"></span></label><input id="sWind" type="range" min="0.3" max="2.5" step="0.05"></div>
    <div class="row"><label>모래알 크기 <span id="vSize"></span></label><input id="sSize" type="range" min="1" max="6" step="0.5"></div>
    <div class="row"><label>바람 줄기(말림) <span id="vTurb"></span></label><input id="sTurb" type="range" min="0" max="2.5" step="0.05"></div>
    <div class="row"><label>은은한 빛 <span id="vGlow"></span></label><input id="sGlow" type="range" min="0" max="1.5" step="0.05"></div>
    <div class="row"><label>우주 흐름 속도 <span id="vStar"></span></label><input id="sStar" type="range" min="0" max="2" step="0.05"></div>
    <div class="row"><label>흩어지는 시간 <span id="vDur"></span></label><input id="sDur" type="range" min="0.6" max="3.5" step="0.1"></div>
    <div class="btns"><button id="reset">기본값</button><button class="p" id="demo">미리보기 ▶</button></div>
    <div id="stats"></div>
  </div>
  <div id="nogl">이 기기에서는 WebGL을 사용할 수 없어 효과를 보여드릴 수 없어요.</div>
</div>
<div id="hint-desktop">PC에서는 마우스로 화면을 끌어서 넘겨보세요 · 뉴니버스 시제품 by Crazing Factory</div>

<script>
(()=>{
'use strict';
const phone=document.getElementById('phone'), bg=document.getElementById('bg'), cv=document.getElementById('gl');
const $=id=>document.getElementById(id);

// ---------- 설정 ----------
const DEF={style:'wind',wind:1.0,size:1.5,turb:1.0,dur:1.7,glow:0.5,star:0.6,wp:'nebula'};
let S=Object.assign({},DEF);
try{Object.assign(S,JSON.parse(localStorage.getItem('nv_sand8')||'{}'))}catch(e){}
const weak=(navigator.hardwareConcurrency||4)<=4||(navigator.deviceMemory||4)<=3;
let CAP=weak?60000:130000;

// ---------- 앱 데이터 ----------
const A=(n,e,c1,c2,t)=>({n,e,c1,c2,t});
const F=(n,items)=>({n,folder:true,items});
const PAGES=[
  {widget:true,apps:[
    A('카카오톡','💬','#FEE500','#F5C800','#3a1d1d'),A('네이버','N','#03C75A','#02a84b'),F('금융',[A('은행','🏦','#2f6bff','#1946c7'),A('페이','💳','#6c5ce7','#4834b8'),A('증권','📈','#ff4d4d','#2f6bff'),A('보험','🛡️','#26a69a','#00796b'),A('카드','💳','#ff7a45','#e04a1a'),A('가계부','📒','#43b649','#2b8a30'),A('환전','💱','#4dd0e1','#1f8fa0'),A('코인','🪙','#ffca28','#ff8f00','#222')]),A('정부24','🏛️','#3a7bd5','#1d4f9a'),
    A('카메라','📷','#4a4a55','#26262e'),A('사진','🖼️','#ff9a62','#ff5e7a'),A('지도','🗺️','#34c3a0','#1a8c74'),A('설정','⚙️','#8e8e99','#5d5d69')]},
  {apps:[
    A('날씨','⛅','#56a8ff','#2f6fe0'),A('캘린더','📅','#ff6b6b','#d93c3c'),A('메모','📝','#ffd45e','#f2a93b'),A('시계','⏰','#2b2b3a','#111118'),
    A('음악','🎵','#ff4fa0','#b4247a'),A('동영상','▶️','#ff3b3b','#b31d1d'),A('웹툰','📖','#00d06c','#00964d'),A('뉴스','📰','#5a6bff','#3341b8'),
    F('쇼핑',[A('쇼핑','🛍️','#ff7a45','#e04a1a'),A('중고거래','🥕','#ff8a3d','#e8641a'),A('선물','🎁','#ff5e7a','#d9345a'),A('장보기','🛒','#43b649','#2b8a30'),A('패션','👗','#9b5cff','#6227c9'),A('뷰티','💄','#ff6f91','#e03565'),A('가구','🛋️','#a1887f','#6d4c41')]),A('배달','🛵','#2ac1bc','#169a96'),A('택시','🚕','#ffcf3d','#f0a400','#222'),A('지하철','🚇','#43b649','#2b8a30'),
    A('페이','💳','#6c5ce7','#4834b8'),A('증권','📈','#ff4d4d','#2f6bff'),A('메일','✉️','#3fa9f5','#1c6fc4'),A('번역','🌐','#4dd0e1','#1f8fa0'),
    A('건강','❤️','#ff6f91','#e03565'),A('게임','🎮','#9b5cff','#6227c9'),A('계산기','🧮','#ff9f0a','#d07a00'),A('파일','📁','#5ac8fa','#2e8fc4')]},
  {card:true,apps:[
    A('병원예약','🏥','#4fc3f7','#1e88c7'),A('학교','🎓','#7e57c2','#4d2c91'),A('국민연금','🪙','#26a69a','#00796b'),A('주민센터','🏢','#78909c','#455a64'),
    A('녹음','🎙️','#ef5350','#b71c1c'),F('도구',[A('손전등','🔦','#ffca28','#ff8f00','#222'),A('스캐너','📄','#66bb6a','#2e7d32'),A('나침반','🧭','#4f7cff','#2a4fd1'),A('자','📏','#ffd45e','#f2a93b'),A('녹화','📹','#ef5350','#b71c1c'),A('타이머','⏱️','#5ac8fa','#2e8fc4')]),A('뉴니버스','🌌','#e6b85c','#7b3fe4')]}
];
const DOCK=[A('전화','📞','#34c759','#1f9d40'),A('메시지','💬','#5ac8fa','#2a86d9'),A('인터넷','🧭','#4f7cff','#2a4fd1'),A('연락처','👤','#ff9f43','#e06a1a')];

// ---------- 레이아웃 ----------
let W=0,H=0,DPR=1,GW=0,GH=0;
let pageCanvases=[], hitRects=[];
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
const FONT='system-ui,-apple-system,"Noto Sans KR","Apple SD Gothic Neo",sans-serif';
const EFONT='"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif';

function drawIcon(c,a,x,y,s){
  c.save();
  c.shadowColor='rgba(0,0,0,.35)';c.shadowBlur=s*.18;c.shadowOffsetY=s*.06;
  const g=c.createLinearGradient(x,y,x+s,y+s);g.addColorStop(0,a.c1);g.addColorStop(1,a.c2);
  rr(c,x,y,s,s,s*.3);c.fillStyle=g;c.fill();
  c.shadowColor='transparent';
  const hl=c.createLinearGradient(x,y,x,y+s*.6);hl.addColorStop(0,'rgba(255,255,255,.28)');hl.addColorStop(1,'rgba(255,255,255,0)');
  rr(c,x+1,y+1,s-2,s*.55,s*.28);c.fillStyle=hl;c.fill();
  c.textAlign='center';c.textBaseline='middle';
  if(/^[A-Za-z]$/.test(a.e)){c.font=`900 ${s*.55}px ${FONT}`;c.fillStyle=a.t||'#fff';c.fillText(a.e,x+s/2,y+s*.53)}
  else{c.font=`${s*.5}px ${EFONT}`;c.fillStyle=a.t||'#fff';c.fillText(a.e,x+s/2,y+s*.55)}
  c.restore();
  c.save();c.font=`500 ${Math.max(11,s*.2)}px ${FONT}`;c.textAlign='center';c.textBaseline='top';
  c.shadowColor='rgba(0,0,0,.6)';c.shadowBlur=4;c.fillStyle='#fff';c.fillText(a.n,x+s/2,y+s+6);c.restore();
}
function drawFolder(c,f,x,y,s){
  c.save();c.shadowColor='rgba(0,0,0,.3)';c.shadowBlur=s*.15;c.shadowOffsetY=s*.05;
  rr(c,x,y,s,s,s*.3);c.fillStyle='rgba(255,255,255,.26)';c.fill();c.shadowColor='transparent';
  c.strokeStyle='rgba(255,255,255,.35)';c.lineWidth=1;c.stroke();
  const pd=s*.13,g=s*.07,ms=(s-pd*2-g)/2;
  f.items.slice(0,4).forEach((a,i)=>{const mx=x+pd+(i%2)*(ms+g),my=y+pd+((i/2)|0)*(ms+g);
    const gr=c.createLinearGradient(mx,my,mx+ms,my+ms);gr.addColorStop(0,a.c1);gr.addColorStop(1,a.c2);
    rr(c,mx,my,ms,ms,ms*.28);c.fillStyle=gr;c.fill();
    c.textAlign='center';c.textBaseline='middle';c.font=`${ms*.55}px ${EFONT}`;c.fillStyle='#fff';c.fillText(a.e,mx+ms/2,my+ms*.56)});
  c.restore();
  c.save();c.font=`500 ${Math.max(11,s*.2)}px ${FONT}`;c.textAlign='center';c.textBaseline='top';
  c.shadowColor='rgba(0,0,0,.6)';c.shadowBlur=4;c.fillStyle='#fff';c.fillText(f.n,x+s/2,y+s+6);c.restore();
}
function glass(c,x,y,w,h,r){
  c.save();rr(c,x,y,w,h,r);c.fillStyle='rgba(255,255,255,.13)';c.fill();
  c.strokeStyle='rgba(255,255,255,.22)';c.lineWidth=1;c.stroke();c.restore();
}
function dockTop(){return H-14-safeB()-88}
function safeB(){return parseFloat(getComputedStyle($('safe')).paddingBottom)||0}
function widgetRect(){return {x:18,y:70,w:W-36,h:Math.min(190,H*.23)}}
function gridTop(pi){
  if(pi===0){const r=widgetRect();return r.y+r.h+80}
  if(pi===2)return 70+Math.min(150,H*.18)+30;
  return 96;
}
function renderPage(pi){
  let cnv=pageCanvases[pi]||document.createElement('canvas');
  cnv.width=GW;cnv.height=GH;
  const c=cnv.getContext('2d');c.setTransform(DPR,0,0,DPR,0,0);c.clearRect(0,0,W,H);
  const P=PAGES[pi];hitRects[pi]=[];
  const now=new Date();
  if(P.widget){
    const r=widgetRect();glass(c,r.x,r.y,r.w,r.h,28);
    const hh=String(now.getHours()).padStart(2,'0'),mm=String(now.getMinutes()).padStart(2,'0');
    c.fillStyle='#fff';c.textBaseline='alphabetic';c.textAlign='left';
    c.font=`200 ${r.h*.46}px ${FONT}`;c.fillText(`${hh}:${mm}`,r.x+22,r.y+r.h*.52);
    const days=['일','월','화','수','목','금','토'];
    c.font=`600 ${r.h*.1}px ${FONT}`;c.fillStyle='rgba(255,255,255,.9)';
    c.fillText(`${now.getMonth()+1}월 ${now.getDate()}일 ${days[now.getDay()]}요일`,r.x+24,r.y+r.h*.7);
    c.font=`400 ${r.h*.085}px ${FONT}`;c.fillStyle='rgba(255,255,255,.7)';
    c.fillText('서울 · 맑음 12°  |  미세먼지 좋음',r.x+24,r.y+r.h*.86);
    c.textAlign='right';c.font=`${r.h*.3}px ${EFONT}`;c.fillText('☀️',r.x+r.w-22,r.y+r.h*.45);
    hitRects[pi].push({x:r.x,y:r.y,w:r.w,h:r.h,n:'시계 위젯'});
    // 검색창
    const sy=r.y+r.h+18,sh=46;rr(c,18,sy,W-36,sh,23);c.fillStyle='rgba(255,255,255,.9)';c.fill();
    c.textAlign='left';c.textBaseline='middle';c.font=`18px ${EFONT}`;c.fillText('🔍',34,sy+sh/2+1);
    c.font=`400 15px ${FONT}`;c.fillStyle='#777';c.fillText('무엇이든 검색하세요',64,sy+sh/2);
    c.font=`18px ${EFONT}`;c.textAlign='right';c.fillText('🎤',W-34,sy+sh/2+1);

  cell=Math.max(2,Math.round(S.size*DPR));

  for(;;){cs=[0,1,2].map(pi=>cellsFor(pi,cell));const mx=Math.max(...cs.map(a=>a.length/2));if(mx<=CAP||cell>=maxPt)break;cell++}
  for(let pi=0;pi<3;pi++){
    const c=cs[pi],n=c.length/2,arr=new Float32Array(n*5);
    for(let k=0;k<n;k++){arr[k*5]=(c[k*2]+.5)*cell/GW;arr[k*5+1]=(c[k*2+1]+.5)*cell/GH;arr[k*5+2]=Math.random();arr[k*5+3]=Math.random();arr[k*5+4]=Math.random()}
    if(!bufs[pi])bufs[pi]=gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER,bufs[pi]);gl.bufferData(gl.ARRAY_BUFFER,arr,gl.STATIC_DRAW);counts[pi]=n;
  }
  alphaData=[];
  // 흩어졌다 모이기: 페이지 쌍마다 출발점(현재 페이지)→도착점(다음 페이지) 매핑
  const sorted=cs.map(c=>{const n=c.length/2,idx=new Array(n);for(let k=0;k<n;k++)idx[k]=k;
    const key=new Float32Array(n);for(let k=0;k<n;k++)key[k]=c[k*2+1]+c[k*2]*0.02+Math.random()*1.5;
    idx.sort((a,b)=>key[a]-key[b]);return idx});
  for(const [a,b] of [[0,1],[1,0],[1,2],[2,1]]){
    const ca=cs[a],cb=cs[b],na=ca.length/2,nb=cb.length/2,N=Math.max(na,nb),arr=new Float32Array(N*9);
    let pa=-1,pb=-1;
    for(let i=0;i<N;i++){
      const ia=Math.floor(i*na/N),ib=Math.floor(i*nb/N),ka=sorted[a][ia],kb=sorted[b][ib],o=i*9;
      arr[o]=(ca[ka*2]+.5)*cell/GW;arr[o+1]=(ca[ka*2+1]+.5)*cell/GH;arr[o+2]=(cb[kb*2]+.5)*cell/GW;arr[o+3]=(cb[kb*2+1]+.5)*cell/GH;
      arr[o+4]=Math.random();arr[o+5]=Math.random();arr[o+6]=Math.random();arr[o+7]=ia===pa?1:0;arr[o+8]=ib===pb?1:0;pa=ia;pb=ib;
    }
    const key=a+'-'+b;if(!pairBufs[key])pairBufs[key]=gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER,pairBufs[key]);gl.bufferData(gl.ARRAY_BUFFER,arr,gl.STATIC_DRAW);pairCounts[key]=N;
  }
  updateStats();
}

// ---------- 상태 ----------
let cur=0,target=-1,dir=-1,t=0,off=0,anim=null,dragging=false,startT=performance.now();
let fpsAcc=0,fpsN=0,lastFps=60,needRebuild=false;

function layout(){
  const r=phone.getBoundingClientRect();W=r.width;H=r.height;DPR=Math.min(window.devicePixelRatio||1,2);
  GW=Math.round(W*DPR);GH=Math.round(H*DPR);cv.width=GW;cv.height=GH;
  drawBg();for(let i=0;i<3;i++){renderPage(i);upload(i)}
  buildParticles();
  const dT=dockTop();$('dots').style.top=(dT-22)+'px';$('hint').style.top=(dT-50)+'px';
  draw();
}
function quadDraw(tx,alpha,scale,ox){
  gl.useProgram(P2);gl.bindBuffer(gl.ARRAY_BUFFER,quad);gl.enableVertexAttribArray(L2);gl.vertexAttribPointer(L2,2,gl.FLOAT,false,0,0);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tx);gl.uniform1i(U2.u_tex,0);
  gl.uniform1f(U2.u_a,alpha);gl.uniform1f(U2.u_s,scale);gl.uniform1f(U2.u_ox,ox);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  gl.disableVertexAttribArray(L2);
}
function draw(){
  const now=performance.now(),time=(now-startT)/1000;
  gl.viewport(0,0,GW,GH);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);
  gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);
  if(target<0||t<=0){quadDraw(tex[cur],1,1,off*2/W);return}
  const glow=S.glow*(weak?.7:1);
  if(S.style==='morph'){
    const key=cur+'-'+target;
    gl.useProgram(PM);gl.bindBuffer(gl.ARRAY_BUFFER,pairBufs[key]);
    gl.enableVertexAttribArray(LM.sd);gl.enableVertexAttribArray(LM.rnd);gl.enableVertexAttribArray(LM.dup);
    gl.vertexAttribPointer(LM.sd,4,gl.FLOAT,false,36,0);gl.vertexAttribPointer(LM.rnd,3,gl.FLOAT,false,36,16);gl.vertexAttribPointer(LM.dup,2,gl.FLOAT,false,36,28);
    gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex[cur]);gl.uniform1i(UM.u_ta,0);
    gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,tex[target]);gl.uniform1i(UM.u_tb,1);
    gl.uniform2f(UM.u_res,GW,GH);gl.uniform1f(UM.u_t,t);gl.uniform1f(UM.u_dir,dir);gl.uniform1f(UM.u_wind,S.wind);
    gl.uniform1f(UM.u_turb,S.turb);gl.uniform1f(UM.u_cell,cell);gl.uniform1f(UM.u_time,time);gl.uniform1f(UM.u_dpr,DPR);
    gl.uniform1f(UM.u_glow,glow);gl.uniform2f(UM.u_cellUV,cell/GW,cell/GH);
    gl.drawArrays(gl.POINTS,0,pairCounts[key]);
    gl.disableVertexAttribArray(LM.sd);gl.disableVertexAttribArray(LM.rnd);gl.disableVertexAttribArray(LM.dup);
    gl.activeTexture(gl.TEXTURE0);
    return;
  }
  if(S.style==='wind'){
    // 1) 나가는 먼지: 몽환 스타일 흩날림 (0~60%), 바람 방향으로 더 멀리
    const to=t*1.15;
    if(to<1.2)dustOut(P1,U1,L1,to,glow,1.5);
    // 2) 들어오는 새 모래바람: 반대편에서 불어와 다음 화면을 쌓음 (35~100%)
    const ti=(t-.18)/.82;
    if(ti>0){
      gl.useProgram(PI);gl.bindBuffer(gl.ARRAY_BUFFER,bufs[target]);
      gl.enableVertexAttribArray(LI.uv);gl.enableVertexAttribArray(LI.rnd);
      gl.vertexAttribPointer(LI.uv,2,gl.FLOAT,false,20,0);gl.vertexAttribPointer(LI.rnd,3,gl.FLOAT,false,20,8);
      gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex[target]);gl.uniform1i(UI.u_tex,0);
      gl.uniform2f(UI.u_res,GW,GH);gl.uniform1f(UI.u_t,Math.min(1,ti));gl.uniform1f(UI.u_dir,dir);gl.uniform1f(UI.u_wind,S.wind);
      gl.uniform1f(UI.u_turb,S.turb);gl.uniform1f(UI.u_cell,cell);gl.uniform1f(UI.u_time,time);gl.uniform1f(UI.u_dpr,DPR);
      gl.uniform1f(UI.u_glow,glow);gl.uniform2f(UI.u_cellUV,cell/GW,cell/GH);
      gl.drawArrays(gl.POINTS,0,counts[target]);
      gl.disableVertexAttribArray(LI.uv);gl.disableVertexAttribArray(LI.rnd);
    }
    return;
  }
  const a=Math.min(1,Math.max(0,(t-.12)/.7)),ea=a*a*(3-2*a);
  quadDraw(tex[target],ea,.93+.07*ea,0);
  const old=S.style==='storm';
  dustOut(old?P0:P1,old?U0:U1,old?L0:L1,t,glow,1);
}
function dustOut(P,U,L,tt,glow,push){
  const time=(performance.now()-startT)/1000,old=P===P0;
  gl.useProgram(P);gl.bindBuffer(gl.ARRAY_BUFFER,bufs[cur]);
  gl.enableVertexAttribArray(L.uv);gl.enableVertexAttribArray(L.rnd);
  gl.vertexAttribPointer(L.uv,2,gl.FLOAT,false,20,0);gl.vertexAttribPointer(L.rnd,3,gl.FLOAT,false,20,8);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex[cur]);gl.uniform1i(U.u_tex,0);
  gl.uniform2f(U.u_res,GW,GH);gl.uniform1f(U.u_t,tt);gl.uniform1f(U.u_dir,dir);gl.uniform1f(U.u_wind,S.wind);
  gl.uniform1f(U.u_turb,S.turb);gl.uniform1f(U.u_cell,cell);gl.uniform1f(U.u_time,time);
  gl.uniform1f(U.u_dpr,DPR);gl.uniform1f(U.u_off,0);gl.uniform2f(U.u_cellUV,cell/GW,cell/GH);if(!old){gl.uniform1f(U.u_glow,glow);gl.uniform1f(U.u_push,push)}
  gl.drawArrays(gl.POINTS,0,counts[cur]);
  gl.disableVertexAttribArray(L.uv);gl.disableVertexAttribArray(L.rnd);
}
let raf=0,lastFrame=0;
function loop(ts){
  raf=0;
  if(lastFrame&&anim){const dt=ts-lastFrame;if(dt<100){fpsAcc+=dt;fpsN++}}
  lastFrame=ts;
  if(anim){
    const k=Math.min(1,(ts-anim.t0)/anim.d);
    const e=anim.ease?anim.ease(k):k;
    t=anim.from+(anim.to-anim.from)*e;
    if(anim.offFrom!==undefined)off=anim.offFrom*(1-e);
    if(k>=1){const done=anim.done;anim=null;done&&done()}
  }
  draw();
  if(anim||dragging)req();else lastFrame=0;
}
function req(){if(!raf)raf=requestAnimationFrame(loop)}
const easeOut=k=>1-Math.pow(1-k,3);

function finishTransition(){
  if(fpsN>8){lastFps=1000/(fpsAcc/fpsN);if(lastFps<45&&CAP>12000){CAP=Math.round(CAP*.65);needRebuild=true}}
  fpsAcc=0;fpsN=0;
  cur=target;target=-1;t=0;setDots();updateStats();
  if(needRebuild){needRebuild=false;buildParticles()}
}
function go(to,d){
  target=to;dir=d;
  const from=t;
  anim={t0:performance.now(),d:Math.max(250,S.dur*1000*(1-from)),from,to:1,done:()=>{finishTransition();draw()}};
  req();
}
function snapBack(){
  anim={t0:performance.now(),d:S.style==='morph'?650:S.style==='wind'?520:420,from:t,to:0,offFrom:off,ease:easeOut,done:()=>{target=-1;off=0;draw()}};req();
}
function setDots(){[...$('dots').children].forEach((d,i)=>d.classList.toggle('on',i===cur))}

// ---------- 입력 ----------
let sx=0,sy=0,lx=0,lt=0,vx=0,moved=false,crossed=false,pid=null;
phone.addEventListener('pointerdown',e=>{
  if(e.target.closest('#sheet,#gear,#fold'))return;
  if($('sheet').classList.contains('open')){toggleSheet(false);return}
  if(anim){anim.t0=-1e9;loop(performance.now())}
  pid=e.pointerId;phone.setPointerCapture(pid);
  dragging=true;moved=false;crossed=false;sx=lx=e.clientX;sy=e.clientY;lt=e.timeStamp;vx=0;
  $('hint').style.opacity=0;req();
});
phone.addEventListener('pointermove',e=>{
  if(!dragging||e.pointerId!==pid)return;
  const dx=e.clientX-sx;if(Math.abs(dx)>8||Math.abs(e.clientY-sy)>8)moved=true;
  const dt=e.timeStamp-lt;if(dt>0){vx=.7*vx+.3*((e.clientX-lx)/dt)}lx=e.clientX;lt=e.timeStamp;
  const d=dx<0?-1:1,to=cur-d;
  if(to<0||to>2){target=-1;t=0;off=dx*.25/(1+Math.abs(dx)/300);return}
  off=0;target=to;dir=d;
  const frac=Math.abs(dx)/W;t=S.style==='morph'?Math.min(.32,frac*.45):S.style==='wind'?Math.min(.3,frac*.42):Math.min(.5,frac*.55);
  const over=frac>.2;if(over&&!crossed&&navigator.vibrate)navigator.vibrate(8);crossed=over;
});
function up(e){
  if(!dragging||e.pointerId!==pid)return;dragging=false;
  const dx=e.clientX-sx,frac=Math.abs(dx)/W;
  if(!moved){tap(e);target=-1;t=0;draw();return}
  if(target>=0&&(frac>.2||(Math.abs(vx)>.45&&Math.sign(vx)===Math.sign(dx)&&frac>.05)))go(target,dir);
  else snapBack();
}
phone.addEventListener('pointerup',up);phone.addEventListener('pointercancel',up);

function tap(e){
  const r=phone.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  const h=(hitRects[cur]||[]).find(o=>x>=o.x&&x<=o.x+o.w&&y>=o.y&&y<=o.y+o.h);
  if(h&&h.f)openFolder(h.f,h);else if(h)toast(`${h.n} · 시제품이라 아직 열리지 않아요`);
}
let tt=0;function toast(m){const el=$('toast');el.textContent=m;el.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),1600)}

// ---------- 폴더: 회전 캐러셀 ----------
const FO=$('fold'),FW=FO.querySelector('.wrap'),FSTG=FO.querySelector('.stage'),FL=FO.querySelector('.lbl'),FD=FO.querySelector('.fdots');
let fItems=[],fCards=[],fPos=0,fVel=0,fTarget=0,fRaf=0,fOpen=false,fDrag=null,fLastIdx=-1;
const SP=()=>Math.min(150,W*0.34);
function openFolder(f,r){
  fItems=f.items;FSTG.innerHTML='';FD.innerHTML='';
  fCards=fItems.map((a,i)=>{const d=document.createElement('div');d.className='cd';d.style.background=`linear-gradient(135deg,${a.c1},${a.c2})`;
    d.innerHTML=/^[A-Za-z]$/.test(a.e)?`<b style="font:900 80px ${FONT};color:${a.t||'#fff'}">${a.e}</b>`:a.e;FSTG.appendChild(d);FD.appendChild(document.createElement('i'));return d});
  FO.querySelector('h2').textContent=f.n;
  fPos=fTarget=0;fVel=0;fLastIdx=-1;renderCards();
  const cx=r.x+r.w/2-W/2,cy=r.y+r.w/2-H/2;
  FO._from=`translate(${cx}px,${cy}px) scale(.18)`;FW.style.transform=FO._from;
  FO.style.display='block';void FO.offsetWidth;FO.classList.add('open');FW.style.transform='none';fOpen=true;
}
function closeFolder(){
  if(!fOpen)return;fOpen=false;FO.classList.remove('open');
  FW.style.transform=FO._from;
  setTimeout(()=>{if(!fOpen)FO.style.display='none'},380);
}
function renderCards(){
  const sp=SP();
  fCards.forEach((d,i)=>{
    const p=i-fPos,ap=Math.abs(p);
    const x=Math.sign(p)*(ap<1?ap:1+(ap-1)*0.55)*sp;
    const sc=1+0.25*Math.max(0,1-ap)-0.08*Math.min(ap,3);
    const ry=-Math.max(-1.6,Math.min(1.6,p))*32;
    d.style.transform=`translate3d(${x}px,0,${-Math.min(ap,4)*110}px) rotateY(${ry}deg) scale(${sc})`;
    d.style.opacity=ap>3.4?0:Math.max(0,1-Math.max(0,ap-2.2)/1.2);
    d.style.zIndex=100-Math.round(ap*10);
  });
  const idx=Math.max(0,Math.min(fItems.length-1,Math.round(fPos)));
  if(idx!==fLastIdx){fLastIdx=idx;FL.textContent=fItems[idx].n;[...FD.children].forEach((e,i)=>e.classList.toggle('on',i===idx));if(fDrag&&navigator.vibrate)navigator.vibrate(4)}
}
function fStep(){
  fRaf=0;
  // 스프링: 관성 있게 돌다가 가장 가까운 카드에 착 맞춤
  const k=0.11,dmp=0.76;fVel=(fVel+(fTarget-fPos)*k)*dmp;fPos+=fVel;
  renderCards();
  if(Math.abs(fVel)>0.0005||Math.abs(fTarget-fPos)>0.0005)fRaf=requestAnimationFrame(fStep);else{fPos=fTarget;renderCards()}
}
FO.addEventListener('pointerdown',e=>{
  if(!fOpen)return;FO.setPointerCapture(e.pointerId);cancelAnimationFrame(fRaf);fRaf=0;fVel=0;
  fDrag={x:e.clientX,y:e.clientY,p0:fPos,lx:e.clientX,lt:e.timeStamp,v:0,moved:false,id:e.pointerId,card:e.target.closest('.cd')};
});
FO.addEventListener('pointermove',e=>{
  if(!fDrag||e.pointerId!==fDrag.id)return;
  const dx=e.clientX-fDrag.x,dy=e.clientY-fDrag.y;if(Math.abs(dx)>6||Math.abs(dy)>6)fDrag.moved=true;
  const dt=e.timeStamp-fDrag.lt;if(dt>0)fDrag.v=.6*fDrag.v+.4*((e.clientX-fDrag.lx)/dt);fDrag.lx=e.clientX;fDrag.lt=e.timeStamp;
  if(dy>0&&dy>Math.abs(dx)){FW.style.transition='none';FW.style.transform=`translateY(${dy*.6}px) scale(${1-Math.min(.25,dy/1200)})`;return}
  FW.style.transform='';
  let np=fDrag.p0-dx/SP();const n=fItems.length-1;
  if(np<0)np=np*.35;if(np>n)np=n+(np-n)*.35;fPos=np;renderCards();
});
function fUp(e){
  if(!fDrag||e.pointerId!==fDrag.id)return;const d=fDrag;fDrag=null;
  FW.style.transition='';
  const dx=e.clientX-d.x,dy=e.clientY-d.y;
  if(dy>90&&dy>Math.abs(dx)){closeFolder();return}
  FW.style.transform='';
  if(!d.moved){
    if(!d.card){closeFolder();return}
    const i=fCards.indexOf(d.card);
    if(i===Math.round(fPos))toast(`${fItems[i].n} · 시제품이라 아직 열리지 않아요`);
    else{fTarget=i;fStep()}
    return;
  }
  const n=fItems.length-1;
  fTarget=Math.max(0,Math.min(n,Math.round(fPos-d.v*260/SP())));
  fVel=-d.v*16/SP();fStep();
}
FO.addEventListener('pointerup',fUp);FO.addEventListener('pointercancel',fUp);



// ---------- 설정 패널 ----------
function toggleSheet(o){$('sheet').classList.toggle('open',o)}
$('gear').onclick=e=>{e.stopPropagation();toggleSheet(!$('sheet').classList.contains('open'))};
$('close').onclick=()=>toggleSheet(false);
const sl={wind:['sWind','vWind',v=>v.toFixed(2)+'×'],size:['sSize','vSize',v=>v.toFixed(1)+'px'],turb:['sTurb','vTurb',v=>v.toFixed(2)],dur:['sDur','vDur',v=>v.toFixed(1)+'초'],star:['sStar','vStar',v=>v.toFixed(2)+'×'],glow:['sGlow','vGlow',v=>v.toFixed(2)]};
let sizeTimer=0;
function syncSeg(){[...$('styleSeg').children].forEach(b=>b.classList.toggle('on',b.dataset.s===S.style))}
$('styleSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.style=b.dataset.s;syncSeg();try{localStorage.setItem('nv_sand8',JSON.stringify(S))}catch(_){}};
function syncUI(){syncSeg();for(const k in sl){$(sl[k][0]).value=S[k];$(sl[k][1]).textContent=sl[k][2](S[k])}}
for(const k in sl){$(sl[k][0]).addEventListener('input',e=>{S[k]=parseFloat(e.target.value);$(sl[k][1]).textContent=sl[k][2](S[k]);
  try{localStorage.setItem('nv_sand8',JSON.stringify(S))}catch(_){}
  if(k==='size'){clearTimeout(sizeTimer);sizeTimer=setTimeout(()=>{buildParticles();draw()},150)}})}
$('reset').onclick=()=>{S=Object.assign({},DEF);syncUI();applyWallpaper();try{localStorage.removeItem('nv_sand8')}catch(_){}buildParticles();draw()};
$('demo').onclick=()=>{if(anim)return;const to=cur<2?cur+1:cur-1;go(to,to>cur?-1:1)};
function updateStats(){$('stats').textContent=`v8 · 모래알 ${counts[cur]?counts[cur].toLocaleString('ko-KR'):0}개 · 알갱이 ${cell}px · 최근 ${Math.round(lastFps)}fps${weak?' · 절약 모드':''}`}
syncUI();
window.__nv={pose:(to,d,tt)=>{target=to;dir=d;t=tt;draw()},cur:()=>cur,hits:()=>hitRects[cur]};

// ---------- 시계 ----------
function tick(){
  const n=new Date();$('sbTime').textContent=`${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`;
  if(GW&&!anim&&!dragging){renderPage(0);upload(0);draw()}
}
setInterval(tick,15000);
let rz=0;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(layout,200)});
cv.addEventListener('webglcontextlost',e=>e.preventDefault());
const start=()=>{layout();tick()};
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(start);
})();
</script>
