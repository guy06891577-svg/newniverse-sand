<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src https://open.er-api.com https://latest.currency-api.pages.dev https://cdn.jsdelivr.net">
<title>뉴니버스 계산기</title>
<style>

:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--a1:#6fd3ff;--a2:#8f6bff;--acc:linear-gradient(135deg,var(--a1),var(--a2));--red:#ff4d6d;--fg:#f3f1ff;--sub:rgba(226,222,255,.62);--dim:rgba(226,222,255,.38);
 --glass:rgba(255,255,255,.075);--line:rgba(255,255,255,.14);--r:22px;
 --font:"Pretendard","Noto Sans KR","Apple SD Gothic Neo",system-ui,-apple-system,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;background:#04030c;color:var(--fg);font-family:var(--font);overflow:hidden}
button,input{font-family:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
svg{display:block}
#app{position:fixed;inset:0;overflow:hidden;background:#05040f}
#neb{position:absolute;inset:0;width:100%;height:100%}
.head{position:relative;z-index:2;display:flex;align-items:center;padding:calc(var(--sat) + 10px) 22px 4px;gap:8px}
.head h1{flex:1;font-size:26px;font-weight:800;letter-spacing:-.5px}
.view{position:absolute;inset:0;display:flex;flex-direction:column;padding-top:calc(var(--sat) + 52px);z-index:1}
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2)}
.scroll{overflow-y:auto;overflow-x:hidden;scrollbar-width:none;min-height:0}
.scroll::-webkit-scrollbar{display:none}
.icb{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--fg);flex:none}
.icb svg{width:22px;height:22px}
.icb:active{background:rgba(143,107,255,.18)}
#disp{padding:4px 22px 8px;text-align:right;flex:none}
#expr{min-height:26px;font-size:18px;font-weight:600;color:var(--sub);word-break:break-all;font-variant-numeric:tabular-nums}
#res{font-size:46px;font-weight:800;letter-spacing:-1.2px;line-height:1.15;font-variant-numeric:tabular-nums;padding:2px 0 4px;user-select:none}
#res.err{font-size:22px;font-weight:700;color:var(--red);letter-spacing:0}
#hint{font-size:12px;color:var(--dim);min-height:16px}
#hist{flex:1;padding:0 16px 6px;min-height:52px;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch}
.hrow{display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;padding:8px 10px;border-radius:14px}
.hrow:active{background:rgba(143,107,255,.12)}
.hrow .he{flex:1;min-width:0;color:var(--sub);font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.hrow .hv{flex:none;font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
#hClr{display:block;align-self:center;margin:2px auto 8px;flex:none;font-size:13px;font-weight:700;color:var(--dim);padding:6px 12px;border-radius:12px}
#hClr:active{background:rgba(143,107,255,.12)}
#keys,#fxKeys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:6px 14px calc(var(--sab) + 92px);flex:none}
.k{height:58px;border-radius:18px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-size:26px;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--fg)}
.k:active,.k.pr{background:rgba(143,107,255,.24)}
.k.op{color:var(--a1)}
.k.fn{font-size:20px;color:var(--sub)}
.k.ac{color:var(--red);font-size:18px;font-weight:800}
.k.eq{background:var(--acc);color:#0a0820;border:none;font-weight:800}
.k.eq:active{filter:brightness(1.08)}
.k svg{width:22px;height:22px}
.k.wide{grid-column:span 2}
#tabs{position:absolute;left:14px;right:14px;bottom:calc(var(--sab) + 14px);height:64px;border-radius:24px;display:flex;z-index:5;padding:6px}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13px;font-weight:700;color:var(--dim);border-radius:18px}
#tabs button svg{width:22px;height:22px}
#tabs button.on{color:var(--fg);background:rgba(255,255,255,.08)}
#tabs button.on svg{stroke:url(#gacc)}
#fxBox{padding:4px 16px 0;display:flex;flex-direction:column;gap:10px;flex:none}
.fxcard{display:block;width:100%;text-align:left;border-radius:22px;padding:14px 16px 12px;position:relative}
.fxcard.on{border-color:rgba(111,211,255,.45);box-shadow:0 0 0 1px rgba(111,211,255,.25)}
.fxlab{display:block;font-size:12px;font-weight:700;color:var(--dim);letter-spacing:.2px}
.fxcur,.fxpick{display:block;margin-top:2px;font-size:15px;font-weight:700;color:var(--a1);background:none;border:none;padding:0;text-align:left}
.fxpick{display:inline-flex;align-items:center;gap:4px}
.fxpick svg{width:16px;height:16px}
.fxamt{display:block;margin-top:4px;font-size:32px;font-weight:800;letter-spacing:-.8px;font-variant-numeric:tabular-nums;line-height:1.2;word-break:break-all}
#fxSwap{display:flex;width:40px;height:40px;margin:-6px auto;z-index:2;border-radius:50%;background:rgba(20,16,44,.92);border:1px solid var(--line);color:var(--fg);position:relative}
#fxStack{position:relative}
#fxMeta{padding:8px 22px 0;text-align:center;flex:none}
#fxRate{font-size:16px;font-weight:700;margin-top:4px}
#fxWhen{font-size:13px;color:var(--sub);margin-top:4px;font-weight:600}
#fxNote{font-size:12px;color:var(--dim);margin-top:3px;line-height:1.45}
#fxRef{display:inline-flex;align-items:center;justify-content:center;gap:6px;margin:8px auto 0;padding:8px 16px;border-radius:16px;font-size:14px;font-weight:800}
#fxRef svg{width:16px;height:16px}
#fxRef:active{background:rgba(143,107,255,.16)}
#fxChips{display:flex;gap:6px;padding:8px 14px 0;overflow-x:auto;scrollbar-width:none;flex:none}
#fxChips::-webkit-scrollbar{display:none}
#fxChips button{flex:none;padding:8px 12px;border-radius:16px;font-size:13px;font-weight:700;color:var(--sub);background:rgba(255,255,255,.06);border:1px solid var(--line)}
#fxChips button.on{color:#0a0820;background:var(--acc);border:none}
#sheet{position:absolute;inset:0;z-index:20}
#sheet .bd{position:absolute;inset:0;background:rgba(4,3,12,.55)}
#sheet .box{position:absolute;left:0;right:0;bottom:0;max-height:78%;border-radius:24px 24px 0 0;padding:12px 16px calc(var(--sab) + 16px);display:flex;flex-direction:column}
#sheet .hh{font-size:18px;font-weight:800;padding:6px 8px 10px}
#fxQ{width:100%;height:46px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.06);padding:0 14px;font-size:16px;outline:none}
#fxQ::placeholder{color:var(--dim)}
#fxList{flex:1;overflow-y:auto;margin-top:8px;min-height:0}
#fxList button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 10px;border-radius:14px}
#fxList button:active,#fxList button.on{background:rgba(143,107,255,.14)}
#fxList .cn{flex:1;font-size:16px;font-weight:700}
#fxList .cc{font-size:13px;color:var(--dim);font-weight:700}
#toast{position:absolute;left:50%;bottom:calc(var(--sab) + 100px);transform:translateX(-50%) translateY(20px);opacity:0;z-index:40;padding:10px 16px;border-radius:18px;font-size:14px;font-weight:700;white-space:nowrap;transition:all .2s;pointer-events:none;background:rgba(24,20,52,.94);border:1px solid var(--line)}
#toast.on{opacity:1;transform:translateX(-50%)}

.head .tools{display:flex;gap:2px;margin-left:auto}
.head .icb.on{background:rgba(143,107,255,.22);color:var(--a1)}
#sci{display:none;grid-template-columns:repeat(4,1fr);gap:6px;padding:0 14px 4px;flex:none}
body.sci #sci{display:grid}
body.sci #hist{display:none}
body.sci #hint{display:none}
body.sci .k{height:48px;font-size:24px;border-radius:16px}
body.sci #keys{padding-top:2px}
.sk{height:40px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--fg);padding:0 2px}
.sk:active,.sk.pr{background:rgba(143,107,255,.24)}
.sk.on{background:var(--acc);color:#0a0820;border:none}
.sk.ang{color:var(--a1);font-size:13px;font-weight:800;letter-spacing:-.2px}
#v-unit{padding-top:calc(var(--sat) + 6px)}
#uHead{display:flex;align-items:center;padding:6px 8px 4px;gap:4px}
#uHead h1{flex:1;font-size:22px;font-weight:800;letter-spacing:-.4px}
#uCats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:6px 12px 8px;flex:none}
#uCats::-webkit-scrollbar{display:none}
#uCats button{flex:none;padding:8px 12px;border-radius:16px;font-size:13px;font-weight:700;color:var(--sub);background:rgba(255,255,255,.06);border:1px solid var(--line)}
#uCats button.on{color:#0a0820;background:var(--acc);border:none}
#uBody{flex:1;min-height:0;display:flex;gap:10px;padding:0 12px calc(var(--sab) + 16px)}
#uLeft{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;overflow-y:auto;scrollbar-width:none}
#uLeft::-webkit-scrollbar{display:none}
.ucard{border-radius:20px;padding:12px 14px;text-align:left;width:100%}
.ucard.on{border-color:rgba(111,211,255,.45);box-shadow:0 0 0 1px rgba(111,211,255,.25)}
.ulab{display:flex;align-items:center;gap:4px;font-size:14px;font-weight:700;color:var(--a1)}
.ulab svg{width:16px;height:16px}
.uamt{display:block;margin-top:6px;font-size:24px;font-weight:800;letter-spacing:-.6px;font-variant-numeric:tabular-nums;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#uKeys{width:46%;max-width:220px;flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;align-content:start}
#uKeys .k{height:52px;font-size:22px}
#uMeta{font-size:13px;color:var(--sub);line-height:1.45;padding:0 4px;word-break:keep-all}
#uMeta b{color:var(--fg);font-weight:800}
.ufield{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:16px;width:100%;text-align:left;border:1px solid var(--line);background:rgba(255,255,255,.06)}
.ufield.on{border-color:rgba(111,211,255,.45);box-shadow:0 0 0 1px rgba(111,211,255,.25)}
.ufield .fn{font-size:13px;font-weight:700;color:var(--dim)}
.ufield .fv{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.urow{display:flex;gap:8px}
.chip{padding:8px 10px;border-radius:14px;font-size:13px;font-weight:700;color:var(--sub);background:rgba(255,255,255,.06);border:1px solid var(--line);white-space:nowrap}
.urow{flex-wrap:wrap}
.urow .chip{text-align:center;justify-content:center}
.chip.on{color:#0a0820;background:var(--acc);border:none}
#hSheet .box{max-height:78%}
#hList{flex:1;overflow-y:auto;min-height:0;padding:4px 0}
@media (orientation:landscape){
  body.sci #v-calc{flex-wrap:nowrap}
  body.sci #sci{grid-template-columns:repeat(4,1fr)}
  body.sci .k,body.sci .sk{height:36px}
  body.sci #res{font-size:36px}
  .head h1{font-size:22px}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="gacc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6fd3ff"/><stop offset="1" stop-color="#8f6bff"/></linearGradient>
</defs></svg>
<div id="app">
  <canvas id="neb"></canvas>
  <header class="head">
    <h1>계산기</h1>
    <div class="tools">
      <button type="button" class="icb" id="btnHist" aria-label="계산 기록"></button>
      <button type="button" class="icb" id="btnUnit" aria-label="단위 계산기"></button>
      <button type="button" class="icb" id="btnSci" aria-label="공학용"></button>
    </div>
  </header>

  <section id="v-calc" class="view">
    <div id="hist" class="scroll"></div>
    <div id="disp">
      <div id="expr"></div>
      <div id="res">0</div>
      <div id="hint">결과를 길게 누르면 복사돼요</div>
    </div>
    <div id="sci"></div>
    <div id="keys"></div>
  </section>

  <section id="v-fx" class="view" hidden>
    <div id="fxBox">
      <div id="fxStack">
        <button type="button" class="fxcard glass on" id="cardKrw">
          <span class="fxlab">원화</span>
          <span class="fxcur">대한민국 원 · KRW</span>
          <span class="fxamt" id="krwAmt">0</span>
        </button>
        <button type="button" id="fxSwap" class="icb" aria-label="입력 칸 바꾸기"></button>
        <button type="button" class="fxcard glass" id="cardFx">
          <span class="fxlab">외화</span>
          <span class="fxpick" id="fxPick">미국 달러 · USD</span>
          <span class="fxamt" id="fxAmt">0</span>
        </button>
      </div>
    </div>
    <div id="fxMeta">
      <div id="fxRate">환율을 받는 중…</div>
      <div id="fxWhen"></div>
      <div id="fxNote">기준 환율이라 은행 거래 환율과 다를 수 있어요</div>
      <button type="button" id="fxRef" class="glass">새로고침</button>
    </div>
    <div id="fxChips"></div>
    <div id="fxKeys"></div>
  </section>

  <section id="v-unit" class="view" hidden>
    <div id="uHead">
      <button type="button" class="icb" id="uBack" aria-label="뒤로"></button>
      <h1 id="uTitle">단위 계산기</h1>
    </div>
    <div id="uCats"></div>
    <div id="uBody">
      <div id="uLeft"></div>
      <div id="uKeys"></div>
    </div>
  </section>

  <nav id="tabs" class="glass">
    <button type="button" data-v="calc" class="on"><span data-i="calc"></span>계산</button>
    <button type="button" data-v="fx"><span data-i="fx"></span>환율</button>
  </nav>
  <div id="sheet" hidden>
    <div class="bd" id="shBd"></div>
    <div class="box glass">
      <div class="hh" id="shTitle">통화 고르기</div>
      <input id="fxQ" type="search" placeholder="이름이나 코드로 찾기" enterkeyhint="search" autocomplete="off">
      <div id="fxList"></div>
    </div>
  </div>
  <div id="hSheet" hidden>
    <div class="bd" id="hBd"></div>
    <div class="box glass" style="position:absolute;left:0;right:0;bottom:0;max-height:78%;border-radius:24px 24px 0 0;padding:12px 16px calc(var(--sab) + 16px);display:flex;flex-direction:column">
      <div class="hh" style="font-size:18px;font-weight:800;padding:6px 8px 10px">계산 기록</div>
      <div id="hList"></div>
    </div>
  </div>
  <div id="toast"></div>
</div>
<script>

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const NV=window.NVCalc||null;
const P={
  calc:'<rect x="5" y="3" width="14" height="18" rx="3"/><path d="M8 7h8"/><path d="M12 11.5v6M9 14.5h6"/>',
  fx:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
  swap:'<path d="M7 8h11M15 5l3 3-3 3M17 16H6M9 13l-3 3 3 3"/>',
  chev:'<path d="M6 9l6 6 6-6"/>',
  ref:'<path d="M20 12a8 8 0 1 1-2.2-5.5M20 4v6h-6"/>',
  back:'<path d="M18 5H9L4 12l5 7h9a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/><path d="M11.2 9.5l5 5M16.2 9.5l-5 5"/>',
  larr:'<path d="M15 6L9 12l6 6"/>',
  hist:'<circle cx="12" cy="13" r="7.5"/><path d="M12 9.5V13l2.4 1.5"/><path d="M8 4.5h8"/>',
  unit:'<rect x="3" y="8" width="18" height="8" rx="1.5"/><path d="M7 8v4M11 8v5.5M15 8v4M19 8v5.5"/>',
  sci:'<path d="M4 14h2.8l2.6 7 4.2-16H20"/>'
};
const ic=(n,sw=1.9)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${P[n]||''}</svg>`;
function icons(root){(root||document).querySelectorAll('[data-i]').forEach(e=>{if(!e.querySelector('svg'))e.insertAdjacentHTML('afterbegin',ic(e.dataset.i))})}
icons();
$('#fxSwap').innerHTML=ic('swap',2);
$('#fxPick').insertAdjacentHTML('beforeend',ic('chev',2.2));
$('#fxRef').insertAdjacentHTML('afterbegin',ic('ref',2));
$('#btnHist').innerHTML=ic('hist',1.9);
$('#btnUnit').innerHTML=ic('unit',1.9);
$('#btnSci').innerHTML=ic('sci',1.9);
$('#uBack').innerHTML=ic('larr',2);
const buzz=()=>{try{NV&&NV.vibrate(12)}catch(e){}};
const J=(s,d)=>{try{return JSON.parse(s)}catch(e){return d}};
let toastT;function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),2000)}
function nebula(){const c=$('#neb'),r=c.getBoundingClientRect();if(!r.width)return;const d=Math.min(2,devicePixelRatio||1);c.width=r.width*d;c.height=r.height*d;const x=c.getContext('2d');x.scale(d,d);const W=r.width,H=r.height;
 x.fillStyle='#05040f';x.fillRect(0,0,W,H);let s=7;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
 const blob=(cx,cy,rr,col)=>{const g=x.createRadialGradient(cx,cy,0,cx,cy,rr);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,W,H)};
 blob(W*.15,H*.12,W*.9,'rgba(60,120,220,.30)');blob(W*.95,H*.35,W*.85,'rgba(130,80,230,.30)');blob(W*.3,H*.8,W*.9,'rgba(90,60,200,.22)');blob(W*.7,H*.95,W*.6,'rgba(60,170,240,.14)');
 for(let i=0;i<14;i++)blob(W*rnd(),H*rnd(),W*(.1+rnd()*.25),`rgba(${110+rnd()*60|0},${110+rnd()*60|0},255,.07)`);
 for(let i=0;i<170;i++){const a=rnd()*.7+.1,rr=rnd()*1.1+.2;x.fillStyle=`rgba(230,235,255,${a})`;x.beginPath();x.arc(W*rnd(),H*rnd(),rr,0,7);x.fill()}
 x.fillStyle='rgba(5,4,15,.25)';x.fillRect(0,0,W,H)}
let nebT;nebula();addEventListener('resize',()=>{clearTimeout(nebT);nebT=setTimeout(()=>{nebula();syncOri()},200)});
/* ---------- 소수 계산 (0.1+0.2=0.3) ---------- */
const Dec=(()=>{
  const MAXS=24;
  function n(v){
    if(v&&typeof v==='object'&&typeof v.n==='bigint') return v;
    let s=String(v??'0').replace(/,/g,'').trim();
    if(s===''||s==='.'||s==='-'||s==='-.' ) s='0';
    let sign=1n; if(s[0]==='-'){sign=-1n;s=s.slice(1)} else if(s[0]==='+') s=s.slice(1);
    if(!/^\d*(\.\d*)?$/.test(s)) throw 'bad';
    const [a,b='']=s.split('.');
    const int=a===''?'0':a, frac=b;
    return norm({n:sign*BigInt(int+frac), s:frac.length});
  }
  function norm(x){let {n,s}=x; if(n===0n) return {n:0n,s:0}; while(s>0&&n%10n===0n){n/=10n;s--} return {n,s}}
  function align(x,y){x=n(x);y=n(y);const s=Math.max(x.s,y.s);return [{n:x.n*10n**BigInt(s-x.s),s},{n:y.n*10n**BigInt(s-y.s),s}]}
  function add(x,y){const [a,b]=align(x,y);return norm({n:a.n+b.n,s:a.s})}
  function sub(x,y){const [a,b]=align(x,y);return norm({n:a.n-b.n,s:a.s})}
  function mul(x,y){x=n(x);y=n(y);return norm({n:x.n*y.n,s:x.s+y.s})}
  function div(x,y){
    x=n(x);y=n(y); if(y.n===0n) throw 'div0';
    const extra=MAXS; let num=x.n*10n**BigInt(extra+y.s), den=y.n*10n**BigInt(x.s);
    let sign=1n; if(num<0n){sign=-sign;num=-num} if(den<0n){sign=-sign;den=-den}
    let q=num/den, r=num%den; if(r*2n>=den) q+=1n;
    return norm({n:sign*q,s:extra});
  }
  function neg(x){x=n(x);return {n:-x.n,s:x.s}}
  function plain(x){
    x=norm(n(x)); const sign=x.n<0n?'-':''; let d=(x.n<0n?-x.n:x.n).toString();
    if(x.s===0) return sign+d; d=d.padStart(x.s+1,'0'); const i=d.length-x.s; const f=d.slice(i).replace(/0+$/,'');
    return sign+d.slice(0,i)+(f?'.'+f:'');
  }
  function digits(x){x=norm(n(x)); return (x.n<0n?-x.n:x.n).toString().length}
  return {n,add,sub,mul,div,neg,plain,norm,digits};
})();

function comma(s){
  s=String(s); const neg=s[0]==='-'; if(neg)s=s.slice(1);
  const [a,b]=s.split('.'); const i=a.replace(/\B(?=(\d{3})+(?!\d))/g,',');
  return (neg?'-':'')+i+(b!=null?'.'+b:'');
}
function fmtDec(x,maxFrac){
  let s=Dec.plain(x);
  const neg=s[0]==='-'; const body=neg?s.slice(1):s;
  const [a,b='']=body.split('.');
  if(a.replace(/^0+/,'').length>16) throw 'big';
  const mf=maxFrac==null?12:maxFrac;
  let f=b.slice(0,mf).replace(/0+$/,'');
  s=(neg?'-':'')+a+(f?'.'+f:'');
  return comma(s);
}


function fromNum(x){
  if(!Number.isFinite(x)) throw 'bad';
  if(Object.is(x,-0)) x=0;
  let s=x.toFixed(14).replace(/(\.\d*?)0+$/,'$1').replace(/\.$/,'');
  if(s==='-0') s='0';
  return Dec.n(s);
}
function decPow(x,y){
  const yp=Dec.plain(y), xp=Dec.plain(x);
  if(yp==='0') return Dec.n(1);
  if(xp==='0'){ if(yp[0]==='-') throw 'div0'; return Dec.n(0); }
  if(/^-?\d+$/.test(yp)){
    let n=BigInt(yp), neg=n<0n; if(neg) n=-n;
    if(n>999n) return fromNum(Math.pow(Number(xp),Number(yp)));
    let r=Dec.n(1), b=Dec.n(x);
    while(n>0n){ if(n&1n) r=Dec.mul(r,b); b=Dec.mul(b,b); n>>=1n; }
    return neg?Dec.div(Dec.n(1),r):r;
  }
  if(Number(xp)<0) throw 'bad';
  return fromNum(Math.pow(Number(xp),Number(yp)));
}
let angleDeg=true, secondOn=false, sciOn=false;
try{const a=localStorage.getItem('nvc_ang'); if(a==='rad') angleDeg=false;}catch(e){}

function reduceDeg(x){
  let d=Number(Dec.plain(x)); if(!Number.isFinite(d)) return NaN;
  d=((d%360)+360)%360; if(Math.abs(d-360)<1e-12) d=0; return d;
}
function specialSin(d){
  const t={0:0,30:.5,90:1,150:.5,180:0,210:-.5,270:-1,330:-.5};
  const k=Object.keys(t).find(k=>Math.abs(d-Number(k))<1e-10); if(k!=null) return Dec.n(String(t[k]));
  if([45,135].some(v=>Math.abs(d-v)<1e-10)) return fromNum(Math.SQRT2/2);
  if([225,315].some(v=>Math.abs(d-v)<1e-10)) return fromNum(-Math.SQRT2/2);
  if([60,120].some(v=>Math.abs(d-v)<1e-10)) return fromNum(Math.sqrt(3)/2);
  if([240,300].some(v=>Math.abs(d-v)<1e-10)) return fromNum(-Math.sqrt(3)/2);
  return null;
}
function specialCos(d){ return specialSin(((90-d)%360+360)%360); }
function toRadNum(x){ return Number(Dec.plain(x))*Math.PI/180; }
function fromRadToDeg(n){ return n*180/Math.PI; }
const PI=Dec.n('3.141592653589793'), E=Dec.n('2.718281828459045');

function applyFn(fn,x){
  const n=Number(Dec.plain(x));
  if(fn==='√'||fn==='sqrt'){
    if(n<0) throw 'bad';
    const s=Math.sqrt(n);
    if(Number.isInteger(n)&&Math.abs(s-Math.round(s))<1e-12) return Dec.n(String(Math.round(s)));
    return fromNum(s);
  }
  if(fn==='abs'){ const p=Dec.plain(x); return Dec.n(p[0]==='-'?p.slice(1):p); }
  if(fn==='ln'){ if(n<=0) throw 'bad'; if(Math.abs(n-Math.E)<1e-12) return Dec.n(1); return fromNum(Math.log(n)); }
  if(fn==='log'){ if(n<=0) throw 'bad'; const l=Math.log10(n); if(Math.abs(l-Math.round(l))<1e-12 && n>=1) return Dec.n(String(Math.round(l))); return fromNum(l); }
  if(fn==='exp') return fromNum(Math.exp(n));
  if(fn==='sin'||fn==='cos'||fn==='tan'){
    if(angleDeg){
      const d=reduceDeg(x);
      if(fn==='sin'){ const s=specialSin(d); if(s) return s; return fromNum(Math.sin(d*Math.PI/180)); }
      if(fn==='cos'){ const s=specialCos(d); if(s) return s; return fromNum(Math.cos(d*Math.PI/180)); }
      if(fn==='tan'){
        if([90,270].some(v=>Math.abs(d-v)<1e-10)) throw 'bad';
        if([0,180].some(v=>Math.abs(d-v)<1e-10)) return Dec.n(0);
        if([45,225].some(v=>Math.abs(d-v)<1e-10)) return Dec.n(1);
        if([135,315].some(v=>Math.abs(d-v)<1e-10)) return Dec.n(-1);
        return fromNum(Math.tan(d*Math.PI/180));
      }
    }
    const a=n;
    if(fn==='sin'){ if(Math.abs(a)<1e-14) return Dec.n(0); if(Math.abs(a-Math.PI/2)<1e-12) return Dec.n(1); if(Math.abs(a-Math.PI)<1e-12) return Dec.n(0); if(Math.abs(a+Math.PI/2)<1e-12) return Dec.n(-1); return fromNum(Math.sin(a)); }
    if(fn==='cos'){ if(Math.abs(a)<1e-14) return Dec.n(1); if(Math.abs(a-Math.PI/2)<1e-12) return Dec.n(0); if(Math.abs(a-Math.PI)<1e-12) return Dec.n(-1); return fromNum(Math.cos(a)); }
    if(fn==='tan'){ if(Math.abs(a-Math.PI/2)<1e-12||Math.abs(a+Math.PI/2)<1e-12) throw 'bad'; if(Math.abs(a)<1e-14||Math.abs(a-Math.PI)<1e-12) return Dec.n(0); return fromNum(Math.tan(a)); }
  }
  if(fn==='asin'||fn==='acos'||fn==='atan'){
    if(n<-1||n>1){ if(fn!=='atan') throw 'bad'; }
    const a=fn==='asin'?Math.asin(n):fn==='acos'?Math.acos(n):Math.atan(n);
    if(!angleDeg) return fromNum(a);
    const d=fromRadToDeg(a);
    const r=Math.round(d);
    if(Math.abs(d-r)<1e-9) return Dec.n(String(r));
    return fromNum(d);
  }
  throw 'bad';
}

const FN={'sin':1,'cos':1,'tan':1,'asin':1,'acos':1,'atan':1,'ln':1,'log':1,'abs':1,'exp':1,'√':1};
function tokenize(s){
  const t=[]; s=String(s).replace(/×/g,'*').replace(/÷/g,'/').replace(/,/g,'').replace(/\s/g,'')
    .replace(/sin⁻¹/g,'asin').replace(/cos⁻¹/g,'acos').replace(/tan⁻¹/g,'atan');
  let i=0;
  const isVal=x=>x&&(x.n!=null||x==='π'||x==='e'||x===')'||x==='%');
  const implicit=()=>{ const p=t[t.length-1]; if(isVal(p)) t.push('*'); };
  while(i<s.length){
    const c=s[i];
    if(c==='π'){ implicit(); t.push('π'); i++; continue; }
    const rest=s.slice(i);
    const m=rest.match(/^(asin|acos|atan|sin|cos|tan|ln|log|abs|exp|√)/);
    if(m){ implicit(); t.push(m[1]); i+=m[1].length; continue; }
    if(c==='e' && !/[a-zπ^]/i.test(s[i+1]||'')){ implicit(); t.push('e'); i++; continue; }
    if('()+*/^'.includes(c)){ if(c==='(') implicit(); t.push(c); i++; continue; }
    if(c==='%'){ t.push('%'); i++; continue; }
    if(c==='-'){
      const prev=t[t.length-1];
      if(!prev||prev==='('||prev==='+'||prev==='-'||prev==='*'||prev==='/'||prev==='^'||prev==='u-'||FN[prev]){ t.push('u-'); i++; continue; }
      t.push('-'); i++; continue;
    }
    if(/\d/.test(c)||c==='.'){
      const prev=t[t.length-1];
      if(prev==='π'||prev==='e'||prev===')') t.push('*');
      let n=''; while(i<s.length&&(/\d/.test(s[i])||s[i]==='.')) n+=s[i++];
      if(n==='.'||n.split('.').length>2) throw 'bad';
      t.push({n}); continue;
    }
    throw 'bad';
  }
  return t;
}
function evalExpr(s){
  const tokens=tokenize(s); if(!tokens.length) return Dec.n(0);
  const out=[],ops=[],prec={'u-':5,'^':4,'*':3,'/':3,'+':2,'-':2},right={'u-':1,'^':1};
  Object.keys(FN).forEach(f=>prec[f]=6);
  const pushOp=op=>{
    while(ops.length){const t=ops[ops.length-1]; if(t==='(')break; const p=prec[t],q=prec[op]; if(p==null)break; if(p>q||(p===q&&!right[op])) out.push(ops.pop()); else break}
    ops.push(op);
  };
  for(const tok of tokens){
    if(tok&&tok.n!=null) out.push(tok);
    else if(tok==='π'||tok==='e') out.push(tok);
    else if(tok==='%') out.push('%');
    else if(FN[tok]) pushOp(tok);
    else if(tok==='(') ops.push(tok);
    else if(tok===')'){ while(ops.length&&ops[ops.length-1]!=='(') out.push(ops.pop()); if(ops.pop()!=='(') throw 'paren'; if(ops.length&&FN[ops[ops.length-1]]) out.push(ops.pop()); }
    else pushOp(tok);
  }
  while(ops.length){const t=ops.pop(); if(t==='('||t===')') throw 'paren'; out.push(t)}
  const st=[];
  const asNum=x=>x.p?Dec.div(x.v,100):x.v;
  const val=x=>({v:x,p:false});
  for(const t of out){
    if(t&&t.n!=null){ st.push(val(Dec.n(t.n))); continue; }
    if(t==='π'){ st.push(val(PI)); continue; }
    if(t==='e'){ st.push(val(E)); continue; }
    if(t==='%'){ if(!st.length) throw 'empty'; const x=st.pop(); st.push({v:x.v,p:true}); continue; }
    if(t==='u-'){ if(!st.length) throw 'empty'; const x=st.pop(); st.push({v:Dec.neg(x.v),p:x.p}); continue; }
    if(FN[t]){ if(!st.length) throw 'empty'; const x=st.pop(); st.push(val(applyFn(t, asNum(x)))); continue; }
    if(st.length<2) throw 'empty';
    const b=st.pop(),a=st.pop(); let v;
    if(t==='^'){ v=decPow(asNum(a),asNum(b)); st.push(val(v)); continue; }
    if((t==='+'||t==='-')&&b.p&&!a.p){
      const amt=Dec.mul(a.v,Dec.div(b.v,100));
      v=t==='+'?Dec.add(a.v,amt):Dec.sub(a.v,amt);
    }else{
      const av=asNum(a), bv=asNum(b);
      v=t==='+'?Dec.add(av,bv):t==='-'?Dec.sub(av,bv):t==='*'?Dec.mul(av,bv):Dec.div(av,bv);
    }
    st.push(val(v));
  }
  if(st.length!==1) throw 'bad';
  const r=st[0]; return r.p?Dec.div(r.v,100):r.v;
}
function tryEval(s){
  try{
    let e=String(s||'').trim(); if(!e) return {ok:true,value:Dec.n(0),display:'0'};
    if(/[+\-×÷*(/^]$/.test(e)) e=e.replace(/[+\-×÷*(/^]+$/,'');
    if(!e||e==='(') return {ok:true,pending:true,value:null,display:''};
    const v=evalExpr(e); const display=fmtDec(v);
    return {ok:true,value:v,display};
  }catch(err){
    const msg=err==='div0'?'0으로 나눌 수 없어요':err==='paren'?'괄호를 확인해 주세요':err==='big'?'숫자가 너무 커요':'식을 확인해 주세요';
    return {ok:false,error:String(err),message:msg,display:msg};
  }
}

let raw='', justEq=false, hist=[];
try{hist=J(localStorage.getItem('nvc_hist'),[])||[]}catch(e){hist=[]}
if(!Array.isArray(hist)) hist=[];

function curNum(){
  const m=raw.match(/(-?(?:\d+\.?\d*|\.\d+))%?$/); return m?m[1]:'';
}
function setRaw(s){raw=s; justEq=false; renderCalc()}
function pretty(s){
  return String(s)
    .replace(/asin/g,'sin⁻¹').replace(/acos/g,'cos⁻¹').replace(/atan/g,'tan⁻¹')
    .replace(/exp\(/g,'e^(')
    .replace(/\d+(?:\.\d+)?/g,comma);
}
function renderCalc(){
  $('#expr').textContent=raw?pretty(raw):(justEq?'':'');
  const r=tryEval(justEq?raw:raw);
  const el=$('#res');
  if(!raw){el.textContent='0';el.classList.remove('err');return}
  if(r.pending){return}
  el.textContent=r.display; el.classList.toggle('err',!r.ok);
}
function saveHist(){try{localStorage.setItem('nvc_hist',JSON.stringify(hist.slice(0,50)))}catch(e){}}
function renderHist(){
  const box=$('#hist');
  if(!hist.length){box.innerHTML=''; renderHSheet(); return;}
  box.innerHTML=hist.map((h,i)=>`<button type="button" class="hrow" data-i="${i}"><span class="he">${esc(h.expr)}</span><span class="hv">${esc(h.display)}</span></button>`).join('')
    +`<button type="button" id="hClr">기록 지우기</button>`;
  renderHSheet();
}
function renderHSheet(){
  const box=$('#hList'); if(!box) return;
  if(!hist.length){box.innerHTML='<div style="padding:20px;text-align:center;color:var(--dim)">아직 계산 기록이 없어요</div>';return;}
  box.innerHTML=hist.map((h,i)=>`<button type="button" class="hrow" data-i="${i}"><span class="he">${esc(h.expr)}</span><span class="hv">${esc(h.display)}</span></button>`).join('')
    +`<button type="button" id="hClr2" style="display:block;margin:8px auto;font-size:13px;font-weight:700;color:var(--dim);padding:6px 12px">기록 지우기</button>`;
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function wrapOrInsert(fn, close){
  /* fn is like sin / √ / abs / exp ; close=true wraps current value */
  const name=fn==='sqrt'?'√':fn;
  const r=raw?tryEval(raw):null;
  if(justEq || (r&&r.ok&&r.value&&!/[+\-×÷*^(]$/.test(raw) && raw)){
    const inner=justEq?Dec.plain(r.value):(r&&r.ok&&r.value&&!raw.includes('(')?Dec.plain(r.value):raw);
    raw=`${name}(${justEq||(r&&r.ok&&!/[+\-×÷*^]$/.test(raw))? (tryEval(raw).ok?Dec.plain(tryEval(raw).value):raw) : raw})`;
    /* simpler path below */
  }
}
function applyUnary(name){
  const ev=raw?tryEval(raw):{ok:false};
  if(justEq && ev.ok && ev.value){
    raw=`${name}(${Dec.plain(ev.value)})`; justEq=false; renderCalc(); return;
  }
  if(ev.ok && ev.value && raw && !/[+\-×÷*^(]$/.test(raw)){
    raw=`${name}(${raw})`; justEq=false; renderCalc(); return;
  }
  if(justEq){ raw=''; justEq=false; }
  raw+=(raw&&isValEnd(raw)?'×':'')+name+'(';
  renderCalc();
}
function isValEnd(s){ return /(?:\d|π|e|\)|%)$/.test(s); }
function insertConst(sym){
  if(justEq){ raw=''; justEq=false; }
  if(isValEnd(raw)) raw+='×';
  raw+=sym; renderCalc();
}

function press(k){
  buzz();
  if(k==='2nd'){ secondOn=!secondOn; renderSci(); return; }
  if(k==='Deg'||k==='Rad'){
    angleDeg=!angleDeg; try{localStorage.setItem('nvc_ang',angleDeg?'deg':'rad')}catch(e){}
    renderSci(); renderCalc(); return;
  }
  if(k==='sin'||k==='cos'||k==='tan'||k==='asin'||k==='acos'||k==='atan'||k==='ln'||k==='log'||k==='√'||k==='abs'||k==='exp'){ applyUnary(k); return; }
  if(k==='inv'){
    const ev=raw?tryEval(raw):{ok:false};
    if(ev.ok&&ev.value&&raw&&!/[+\-×÷*^(]$/.test(raw)){ raw='1/('+(justEq?Dec.plain(ev.value):raw)+')'; justEq=false; renderCalc(); return; }
    if(justEq){raw='';justEq=false;} raw+=(isValEnd(raw)?'×':'')+'1/('; renderCalc(); return;
  }
  if(k==='sq'){
    const ev=raw?tryEval(raw):{ok:false};
    if(ev.ok&&ev.value&&raw&&!/[+\-×÷*^(]$/.test(raw)){ raw=(justEq?'('+Dec.plain(ev.value)+')':(/^[0-9.πe-]+$/.test(raw)?raw:'('+raw+')'))+'^2'; justEq=false; renderCalc(); return; }
    if(justEq){raw='';justEq=false;} raw+='^2'; renderCalc(); return;
  }
  if(k==='pow'){
    if(justEq){ const ev=tryEval(raw); raw=ev.ok&&ev.value?Dec.plain(ev.value):raw; justEq=false; }
    if(!raw) raw='0';
    if(/[+\-×÷*^(]$/.test(raw)) return;
    raw+='^'; renderCalc(); return;
  }
  if(k==='yroot'){
    if(justEq){ const ev=tryEval(raw); raw=ev.ok&&ev.value?Dec.plain(ev.value):raw; justEq=false; }
    if(!raw) return;
    if(/[+\-×÷*^(]$/.test(raw)) return;
    raw+='^(1/'; renderCalc(); return;
  }
  if(k==='π'||k==='e'){ insertConst(k); return; }
  if(k==='exp10'){
    if(justEq){raw='';justEq=false;}
    raw+=(isValEnd(raw)?'×':'')+'10^('; renderCalc(); return;
  }

  if(k==='AC'||k==='C'){raw='';justEq=false;renderCalc();return}
  if(k==='⌫'){
    if(justEq){raw='';justEq=false;renderCalc();return}
    /* delete function names as a chunk */
    const fns=['asin(','acos(','atan(','sin(','cos(','tan(','ln(','log(','abs(','exp(','√(','10^('];
    const hit=fns.find(f=>raw.endsWith(f));
    if(hit) raw=raw.slice(0,-hit.length);
    else raw=raw.slice(0,-1);
    renderCalc(); return;
  }
  if(k==='='){
    let ev=tryEval(raw);
    if(!raw||ev.pending) return;
    if(!ev.ok && ev.error==='paren'){
      let s=raw, g=0; for(const ch of s){ if(ch==='(')g++; else if(ch===')')g--; }
      if(g>0){ ev=tryEval(s+')'.repeat(g)); if(ev.ok) raw=s+')'.repeat(g); }
    }
    if(!ev.ok){ $('#res').textContent=ev.display;$('#res').classList.add('err'); return; }
    const expr=pretty(raw);
    hist.unshift({expr,display:ev.display}); if(hist.length>50)hist.pop(); saveHist(); renderHist();
    raw=Dec.plain(ev.value); justEq=true; renderCalc(); $('#expr').textContent=expr; return;
  }
  if(k==='±'){
    if(justEq){ const v=tryEval(raw); if(v.ok&&v.value){ raw=Dec.plain(Dec.neg(v.value)); justEq=false; renderCalc(); } return; }
    const m=raw.match(/^(.*?)(-?(?:\d+\.?\d*|\.\d+))(%?)$/);
    if(!m){ if(!raw||/[+\-×÷(^]$/.test(raw)) raw+='-'; renderCalc(); return; }
    const head=m[1], num=m[2], pct=m[3]||'';
    if(num[0]==='-') raw=head+num.slice(1)+pct;
    else raw=head+'-'+num.replace(/^-/,'')+pct;
    renderCalc(); return;
  }
  const ops='+-×÷';
  if(ops.includes(k)){
    if(justEq) justEq=false;
    if(!raw) raw='0';
    if(/[+\-×÷]$/.test(raw)) raw=raw.slice(0,-1)+k;
    else raw+=k;
    renderCalc(); return;
  }
  if(k==='('||k===')'){
    if(justEq){ raw=(k==='(')?'(':raw+k; justEq=false; renderCalc(); return; }
    if(k==='('&&isValEnd(raw)) raw+='×';
    raw+=k; renderCalc(); return;
  }
  if(k==='%'){
    if(justEq) justEq=false;
    if(!raw||/[+\-×÷(%]$/.test(raw)) return;
    raw+='%'; renderCalc(); return;
  }
  /* digits */
  if(justEq){ raw=''; justEq=false; }
  if(k==='.'){
    const n=curNum(); if(n.includes('.')) return;
    raw+=(n===''||n==='-')?'0.':'.'; renderCalc(); return;
  }
  if(k==='00'||/^\d$/.test(k)){
    if(isValEnd(raw)&&curNum()===''&& /[πe)]$/.test(raw)) raw+='×';
    const n=curNum();
    if((n.replace(/^-/,'').replace('.','').length>=12) && n!=='' && n!=='0') return;
    if((n===''||n==='0') && k==='00'){ if(n==='') raw+='0'; renderCalc(); return; }
    if(n==='0' && k!=='.' && !raw.endsWith('.')){ raw=raw.slice(0,-1)+ (k==='00'?'0':k); renderCalc(); return; }
    raw+=k; renderCalc();
  }
}

function curOf(c){return CURMAP[c]||{c,n:c,u:c,j:false}}
function krwPer(c){ if(!fxInfo||!fxInfo.krwPer) return null; const v=fxInfo.krwPer[c]; return v>0?v:null }
function fmtAmt(n,code){
  const x=typeof n==='object'?n:Dec.n(n);
  const j=code==='JPY'||code==='VND'||code==='KRW'||code==='IDR'||code==='MNT';
  /* 환율 계산 결과는 외화·원 모두 읽기 쉽게. 정수 통화는 소수 2자리까지 남기되 끝 0은 깎음 */
  try{return fmtDec(x, j?2:4)}catch(e){return Dec.plain(x)}
}
function whenKo(ms, dayOnly){
  if(!ms) return '';
  const p=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Seoul',month:'numeric',day:'numeric',hour:'numeric',hourCycle:'h23'}).formatToParts(new Date(ms));
  const g=t=>p.find(x=>x.type===t)?.value||'';
  const mo=+g('month'), d=+g('day'), h=+g('hour');
  return dayOnly?`${mo}월 ${d}일 기준`:`${mo}월 ${d}일 ${h}시 기준`;
}
function applyFx(fromSide){
  const rate=krwPer(fxCode);
  if(fromSide==='krw'){
    const a=Dec.n(krwStr||'0');
    if(!rate){ fxStr=krwStr==='0'||krwStr===''?'0':''; renderFx(); return; }
    const v=Dec.div(a, Dec.n(String(rate)));
    const j=fxCode==='JPY'||fxCode==='VND'||fxCode==='IDR'||fxCode==='MNT';
    fxStr=fmtDec(v, j?2:6).replace(/,/g,'');
  }else{
    const a=Dec.n(fxStr||'0');
    if(!rate){ krwStr=fxStr==='0'||fxStr===''?'0':''; renderFx(); return; }
    const v=Dec.mul(a, Dec.n(String(rate)));
    krwStr=fmtDec(v, 2).replace(/,/g,'');
  }
  renderFx();
}
function renderFx(){
  const info=curOf(fxCode);
  $('#fxPick').childNodes[0].textContent=`${info.n} · ${info.c} `;
  $('#krwAmt').textContent=comma(trimDot(krwStr||'0'));
  $('#fxAmt').textContent=comma(trimDot(dispSide(fxStr,fxCode)));
  $('#cardKrw').classList.toggle('on',fxSide==='krw');
  $('#cardFx').classList.toggle('on',fxSide==='fx');
  const rate=krwPer(fxCode);
  if(fxLoading && !rate){ $('#fxRate').textContent='환율을 받는 중…'; }
  else if(!rate){ $('#fxRate').textContent=fxInfo?'이 통화 환율이 없어요':'환율을 받지 못했어요'; }
  else {
    if(info.j){ const won=fmtDec(Dec.mul(Dec.n(String(rate)),100),2); $('#fxRate').textContent=`100엔 = ${won}원`; }
    else { const won=fmtDec(Dec.n(String(rate)),2); $('#fxRate').textContent=`1${info.u} = ${won}원`; }
  }
  let when=fxInfo?whenKo(fxInfo.t, !!fxInfo.dayOnly):'';
  if(fxOffline&&when) when='저장된 환율 · '+when;
  $('#fxWhen').textContent=when;
  renderChips();
}

function fxPress(k){
  buzz();
  let s=fxSide==='krw'?krwStr:fxStr;
  if(k==='AC'){ s='0'; }
  else if(k==='⌫'){ s=s.slice(0,-1); if(s===''||s==='-'||s==='-0') s='0'; }
  else if(k==='.'){ if(s.includes('.')) return; s=(s===''||s==='0')?'0.':s+'.'; }
  else if(k==='00'||/^\d$/.test(k)){
    const body=s.replace(/^-/,'').replace('.','');
    if(body.replace(/^0+/,'').length>=12 && s!=='0') return;
    if(s==='0' && k==='00') return;
    if(s==='0') s=k==='00'?'0':k;
    else s+=k;
  }else return;
  if(fxSide==='krw') krwStr=s; else fxStr=s;
  applyFx(fxSide);
}

function parseEr(j){
  if(!j||j.result!=='success'||!j.rates) return null;
  const krwPer={};
  for(const [c,r] of Object.entries(j.rates)){ const n=Number(r); if(c!=='KRW'&&n>0) krwPer[c]=Number((1/n).toPrecision(12)); }
  if(!krwPer.USD) return null;
  return {krwPer, t:(j.time_last_update_unix||0)*1000, src:'open.er-api.com', dayOnly:false};
}
function parseFw(j){
  const map=j&&(j.krw||j.KRW); if(!map) return null;
  const krwPer={};
  for(const [c,r] of Object.entries(map)){ const n=Number(r); const k=c.toUpperCase(); if(k!=='KRW'&&n>0) krwPer[k]=Number((1/n).toPrecision(12)); }
  if(!krwPer.USD) return null;
  const t=j.date?Date.parse(j.date+'T00:00:00+00:00'):Date.now();
  return {krwPer, t, src:'currency-api', dayOnly:true};
}
async function httpGet(url){
  if(typeof window.__FX_FETCH==='function') return await window.__FX_FETCH(url);
  if(NV&&NV.httpGet){
    const r=NV.httpGet(url);
    if(typeof r==='string'&&r.startsWith('ERR:')) throw r;
    return r;
  }
  const res=await fetch(url,{cache:'no-store'});
  if(!res.ok) throw 'ERR:http '+res.status;
  return await res.text();
}
async function loadRates(force){
  fxLoading=true; fxOffline=false; renderFx();
  const urls=['https://open.er-api.com/v6/latest/KRW','https://latest.currency-api.pages.dev/v1/currencies/krw.json'];
  await new Promise(r=>setTimeout(r,20));
  let lastErr=null;
  for(const url of urls){
    try{
      const body=await httpGet(url);
      const j=typeof body==='string'?J(body,null):body;
      const parsed=url.includes('er-api')?parseEr(j):parseFw(j);
      if(!parsed) throw 'ERR:parse';
      fxInfo=parsed; fxOffline=false; fxLoading=false;
      try{localStorage.setItem('nvc_fx',JSON.stringify(parsed))}catch(e){}
      applyFx(fxSide); return parsed;
    }catch(e){ lastErr=e }
  }
  fxLoading=false;
  if(fxInfo&&fxInfo.krwPer){ fxOffline=true; applyFx(fxSide); if(force) toast('저장된 환율로 계산해요'); return fxInfo; }
  renderFx(); if(force) toast('환율을 받지 못했어요'); return null;
}
$('#fxRef').onclick=()=>{if(!fxLoading) loadRates(true)};

function uToBase(cat,id,x){
  const v=Dec.n(x);
  if(cat==='area'){
    if(id==='m2') return v;
    if(id==='pyeong') return Dec.mul(v,Dec.div(Dec.n(400),Dec.n(121)));
    if(id==='cm2') return Dec.div(v,Dec.n(10000));
    if(id==='km2') return Dec.mul(v,Dec.n(1000000));
    if(id==='ha') return Dec.mul(v,Dec.n(10000));
    if(id==='ac') return Dec.mul(v,Dec.n('4046.8564224'));
    if(id==='ft2') return Dec.mul(v,Dec.n('0.09290304'));
    if(id==='yd2') return Dec.mul(v,Dec.n('0.83612736'));
  }
  if(cat==='len'){
    if(id==='m') return v;
    if(id==='km') return Dec.mul(v,Dec.n(1000));
    if(id==='cm') return Dec.div(v,Dec.n(100));
    if(id==='mm') return Dec.div(v,Dec.n(1000));
    if(id==='ja') return Dec.mul(v,Dec.div(Dec.n(10),Dec.n(33)));
    if(id==='chi') return Dec.mul(v,Dec.div(Dec.n(1),Dec.n(33)));
    if(id==='in') return Dec.mul(v,Dec.n('0.0254'));
    if(id==='ft') return Dec.mul(v,Dec.n('0.3048'));
    if(id==='yd') return Dec.mul(v,Dec.n('0.9144'));
    if(id==='mi') return Dec.mul(v,Dec.n('1609.344'));
  }
  if(cat==='vol'){
    if(id==='L') return v;
    if(id==='mL') return Dec.div(v,Dec.n(1000));
    if(id==='m3') return Dec.mul(v,Dec.n(1000));
    if(id==='gal') return Dec.mul(v,Dec.n('3.785411784'));
    if(id==='cup') return Dec.mul(v,Dec.n('0.2365882365'));
    if(id==='tbsp') return Dec.mul(v,Dec.n('0.014786764781'));
    if(id==='tsp') return Dec.mul(v,Dec.n('0.00492892159375'));
    if(id==='doe') return Dec.mul(v,Dec.n('1.8'));
    if(id==='mal') return Dec.mul(v,Dec.n('18'));
  }
  if(cat==='mass'){
    if(id==='g') return v;
    if(id==='kg') return Dec.mul(v,Dec.n(1000));
    if(id==='t') return Dec.mul(v,Dec.n(1000000));
    if(id==='mg') return Dec.div(v,Dec.n(1000));
    if(id==='geun') return Dec.mul(v,Dec.n(600));
    if(id==='lb') return Dec.mul(v,Dec.n('453.59237'));
    if(id==='oz') return Dec.mul(v,Dec.n('28.349523125'));
  }
  if(cat==='data'){
    const p={B:0,KB:1,MB:2,GB:3,TB:4,PB:5}[id]||0;
    return Dec.mul(v, decPow(Dec.n(1024),Dec.n(p)));
  }
  if(cat==='spd'){
    if(id==='kmh') return v;
    if(id==='ms') return Dec.mul(v,Dec.n('3.6'));
    if(id==='mph') return Dec.mul(v,Dec.n('1.609344'));
    if(id==='kn') return Dec.mul(v,Dec.n('1.852'));
  }
  if(cat==='time'){
    if(id==='s') return v;
    if(id==='ms') return Dec.div(v,Dec.n(1000));
    if(id==='min') return Dec.mul(v,Dec.n(60));
    if(id==='h') return Dec.mul(v,Dec.n(3600));
    if(id==='day') return Dec.mul(v,Dec.n(86400));
    if(id==='wk') return Dec.mul(v,Dec.n(604800));
  }
  return v;
}
function uFromBase(cat,id,base){
  const v=base;
  if(cat==='area'){
    if(id==='m2') return v;
    if(id==='pyeong') return Dec.div(v,Dec.div(Dec.n(400),Dec.n(121)));
    if(id==='cm2') return Dec.mul(v,Dec.n(10000));
    if(id==='km2') return Dec.div(v,Dec.n(1000000));
    if(id==='ha') return Dec.div(v,Dec.n(10000));
    if(id==='ac') return Dec.div(v,Dec.n('4046.8564224'));
    if(id==='ft2') return Dec.div(v,Dec.n('0.09290304'));
    if(id==='yd2') return Dec.div(v,Dec.n('0.83612736'));
  }
  if(cat==='len'){
    if(id==='m') return v;
    if(id==='km') return Dec.div(v,Dec.n(1000));
    if(id==='cm') return Dec.mul(v,Dec.n(100));
    if(id==='mm') return Dec.mul(v,Dec.n(1000));
    if(id==='ja') return Dec.div(v,Dec.div(Dec.n(10),Dec.n(33)));
    if(id==='chi') return Dec.div(v,Dec.div(Dec.n(1),Dec.n(33)));
    if(id==='in') return Dec.div(v,Dec.n('0.0254'));
    if(id==='ft') return Dec.div(v,Dec.n('0.3048'));
    if(id==='yd') return Dec.div(v,Dec.n('0.9144'));
    if(id==='mi') return Dec.div(v,Dec.n('1609.344'));
  }
  if(cat==='vol'){
    if(id==='L') return v;
    if(id==='mL') return Dec.mul(v,Dec.n(1000));
    if(id==='m3') return Dec.div(v,Dec.n(1000));
    if(id==='gal') return Dec.div(v,Dec.n('3.785411784'));
    if(id==='cup') return Dec.div(v,Dec.n('0.2365882365'));
    if(id==='tbsp') return Dec.div(v,Dec.n('0.014786764781'));
    if(id==='tsp') return Dec.div(v,Dec.n('0.00492892159375'));
    if(id==='doe') return Dec.div(v,Dec.n('1.8'));
    if(id==='mal') return Dec.div(v,Dec.n('18'));
  }
  if(cat==='mass'){
    if(id==='g') return v;
    if(id==='kg') return Dec.div(v,Dec.n(1000));
    if(id==='t') return Dec.div(v,Dec.n(1000000));
    if(id==='mg') return Dec.mul(v,Dec.n(1000));
    if(id==='geun') return Dec.div(v,Dec.n(600));
    if(id==='lb') return Dec.div(v,Dec.n('453.59237'));
    if(id==='oz') return Dec.div(v,Dec.n('28.349523125'));
  }
  if(cat==='data'){
    const p={B:0,KB:1,MB:2,GB:3,TB:4,PB:5}[id]||0;
    return Dec.div(v, decPow(Dec.n(1024),Dec.n(p)));
  }
  if(cat==='spd'){
    if(id==='kmh') return v;
    if(id==='ms') return Dec.div(v,Dec.n('3.6'));
    if(id==='mph') return Dec.div(v,Dec.n('1.609344'));
    if(id==='kn') return Dec.div(v,Dec.n('1.852'));
  }
  if(cat==='time'){
    if(id==='s') return v;
    if(id==='ms') return Dec.mul(v,Dec.n(1000));
    if(id==='min') return Dec.div(v,Dec.n(60));
    if(id==='h') return Dec.div(v,Dec.n(3600));
    if(id==='day') return Dec.div(v,Dec.n(86400));
    if(id==='wk') return Dec.div(v,Dec.n(604800));
  }
  return v;
}
function tempConvert(from,to,x){
  const n=Dec.n(x);
  let c;
  if(from==='C') c=n;
  else if(from==='K') c=Dec.sub(n,Dec.n('273.15'));
  else if(from==='F') c=Dec.div(Dec.mul(Dec.sub(n,Dec.n(32)),Dec.n(5)),Dec.n(9));
  else c=n;
  if(to==='C') return c;
  if(to==='K') return Dec.add(c,Dec.n('273.15'));
  if(to==='F') return Dec.add(Dec.div(Dec.mul(c,Dec.n(9)),Dec.n(5)),Dec.n(32));
  return c;
}
function unitConvert(cat,from,to,amount){
  if(cat==='temp') return tempConvert(from,to,amount);
  const b=uToBase(cat,from,amount);
  return uFromBase(cat,to,b);
}
function fmtUnit(x,maxF){ try{return fmtDec(typeof x==='object'?x:Dec.n(x), maxF==null?6:maxF);}catch(e){return String(x)} }

function taxInc(supply){
  const s=Dec.n(String(supply).replace(/,/g,''));
  const vat=Dec.div(s,Dec.n(10));
  const incl=Dec.add(s,vat);
  return {supply:fmtDec(s,2), vat:fmtDec(vat,2), incl:fmtDec(incl,2),
    supplyP:Dec.plain(s), vatP:Dec.plain(vat), inclP:Dec.plain(incl)};
}
function taxExt(incl){
  const t=Dec.n(String(incl).replace(/,/g,''));
  const s=Dec.div(t,Dec.n('1.1'));
  const vat=Dec.sub(t,s);
  return {supply:fmtDec(s,2), vat:fmtDec(vat,2), incl:fmtDec(t,2),
    supplyP:Dec.plain(s), vatP:Dec.plain(vat), inclP:Dec.plain(t)};
}
function taxDisc(price,rate){
  const p=Dec.n(String(price).replace(/,/g,'')), r=Dec.n(String(rate).replace(/,/g,''));
  const off=Dec.div(Dec.mul(p,r),Dec.n(100));
  const sale=Dec.sub(p,off);
  return {price:fmtDec(p,2), rate:fmtDec(r,4), off:fmtDec(off,2), sale:fmtDec(sale,2),
    offP:Dec.plain(off), saleP:Dec.plain(sale)};
}
function nbbangCalc(total,people,step){
  const T=Math.round(Number(String(total).replace(/,/g,'')));
  const N=Math.floor(Number(String(people).replace(/,/g,'')));
  const S=Number(step)||0;
  if(!(T>=0) || !(N>=1)) return {ok:false};
  if(!S){
    const per=Math.floor(T/N), rem=T-per*N;
    return {ok:true,mode:'remain',per,rem,sum:per*N,total:T,people:N,step:0,
      perD:comma(String(per)), remD:comma(String(rem)), sumD:comma(String(per*N))};
  }
  const per=Math.ceil((T/N)/S)*S, sum=per*N, extra=sum-T;
  return {ok:true,mode:'up',per,extra,sum,total:T,people:N,step:S,
    perD:comma(String(per)), extraD:comma(String(extra)), sumD:comma(String(sum))};
}

function editNum(s,k,maxd,allowDot){
  if(k==='C'||k==='AC') return '0';
  if(k==='⌫'){ s=s.slice(0,-1); return (s===''||s==='-'||s==='-0')?'0':s; }
  if(k==='±'||k==='+/-'){ if(s[0]==='-') return s.slice(1)||'0'; return s==='0'?s:'-'+s; }
  if(k==='.'){ if(!allowDot||s.includes('.')) return s; return (s===''||s==='-')?'0.':s+'.'; }
  if(k==='00'||/^\d$/.test(k)){
    const body=s.replace(/^-/,'').replace('.','');
    if(body.replace(/^0+/,'').length>=maxd && s!=='0') return s;
    if(s==='0'&&k==='00') return s;
    if(s==='0') return k==='00'?'0':k;
    return s+k;
  }
  return s;
}

}

  state:()=>({cat:uCat,from:uFrom,to:uTo,side:uSide,str:uStr,fromName:unitName(uCat,uFrom),toName:unitName(uCat,uTo)}),
  press:uPress, move:uMove
};

else if(fxInfo&&fxInfo.krwPer){ /* keep cache */ }
